<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogo de facções: protótipo do mapa</title>
<style>
  :root { --fundo: rgba(14, 19, 26, .9); --borda: rgba(255,255,255,.1); --texto: #e9edf2; --suave: #9aa6b4; --ouro: #f2b233; --ruim: #f08a6a; --bom: #8fd18f; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1218; color: var(--texto);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; font-size: 14px; }
  canvas#cena { display: block; width: 100%; height: 100%; touch-action: none; }
  .ico { display: inline-flex; width: 1em; height: 1em; font-size: 20px; line-height: 1; vertical-align: middle; flex: none; user-select: none; }
  .ico svg { width: 100%; height: 100%; fill: currentColor; display: block; }
  .ico.grande { font-size: 28px; }
  .oculto { display: none !important; }
  .painel { position: absolute; background: var(--fundo); border: 1px solid var(--borda); border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(6px); box-shadow: 0 6px 24px rgba(0,0,0,.35); }
  .rotulo-peq { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--suave); }
  h1 { font-size: 22px; margin: 4px 0 10px; }
  p { margin: 6px 0; line-height: 1.45; color: #c9d1da; }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid rgba(255,255,255,.16); background: #1c2530; color: var(--texto);
    padding: 7px 11px; display: inline-flex; align-items: center; gap: 6px; }
  button:hover { background: #26323f; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.principal { background: var(--ouro); color: #1a1408; border-color: var(--ouro); font-weight: 700; }
  button.principal:hover { background: #ffc54d; }
  button.largo { width: 100%; justify-content: center; margin-top: 10px; }
  button.mini { padding: 4px; border: none; background: transparent; }
  button.mini:hover { background: rgba(255,255,255,.1); }
  input[type=text] { font: inherit; background: #0b0f14; color: var(--texto); border: 1px solid rgba(255,255,255,.2); border-radius: 6px; padding: 7px 9px; width: 100%; box-sizing: border-box; }
  select { font: inherit; font-size: 12px; background: #0b0f14; color: var(--texto); border: 1px solid rgba(255,255,255,.2); border-radius: 6px; padding: 4px 6px; width: 100%; }
  label { display: block; font-size: 12px; color: var(--suave); margin: 10px 0 4px; }
  .nota { font-size: 12px; color: var(--suave); margin-top: 6px; line-height: 1.4; }
  .aviso-txt { font-size: 13px; color: #f0c27a; margin-top: 10px; line-height: 1.4; }
  .ruim { color: var(--ruim) !important; } .bom { color: var(--bom); }
  .clicavel { cursor: pointer; }

  /* menu */
  #menu { top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(440px, 88vw); }
  .linha-form { display: flex; gap: 8px; }
  .opcoes { display: flex; gap: 6px; } .opcoes button { flex: 1; justify-content: center; }
  .opcoes button.ativo { background: var(--ouro); color: #1a1408; border-color: var(--ouro); font-weight: 700; }

  /* barra do topo */
  #topo { position: absolute; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 0 12px; background: linear-gradient(rgba(10,14,19,.95), rgba(10,14,19,.8)); border-bottom: 1px solid var(--borda); }
  .t-esq { display: flex; align-items: center; gap: 8px; color: var(--suave); font-size: 13px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #recursos { display: flex; gap: 6px; }
  #recursos .rec { padding: 4px 12px 4px 8px; background: rgba(255,255,255,.06); border-color: transparent; }
  #recursos .rec .ico { font-size: 26px; }
  .rec-dinheiro .ico { color: #8fd18f; } .rec-influencia .ico { color: #c9a0ff; } .rec-comida .ico { color: #f2b233; }
  #recursos .t { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; }
  #recursos .n { font-size: 10px; color: var(--suave); text-transform: uppercase; letter-spacing: .08em; }
  #recursos .v { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
  #recursos .d { font-size: 11px; font-weight: 400; color: var(--bom); }
  #combates { background: #c8392a; border-color: #ff6a4a; font-weight: 700; animation: pulsa 1.2s infinite; }
  #combates .ico { color: #ffd2a0; }
  @keyframes pulsa { 50% { box-shadow: 0 0 0 5px rgba(255,90,58,.35); } }
  #menu-jogo { display: flex; gap: 2px; margin-left: 6px; padding-left: 8px; border-left: 1px solid var(--borda); }
  #menu-jogo button { flex-direction: column; gap: 1px; padding: 4px 8px; border: none; background: transparent; font-size: 11px; color: #c9d1da; min-width: 62px; }
  #menu-jogo button .ico { font-size: 22px; color: var(--texto); }
  #menu-jogo button:hover { background: rgba(255,255,255,.08); }
  #menu-jogo button.ativo { background: var(--ouro); color: #1a1408; } #menu-jogo button.ativo .ico { color: #1a1408; }
  body.pausado #relogio::after { content: " · pausado"; color: var(--ouro); }
  .t-dir { display: flex; align-items: center; gap: 6px; }
  #tempo { display: flex; gap: 2px; background: rgba(255,255,255,.05); border-radius: 8px; padding: 2px; }
  #tempo button { padding: 4px 7px; border: none; background: transparent; }
  #tempo button.ativo { background: var(--ouro); color: #1a1408; }
  #relogio { font-variant-numeric: tabular-nums; min-width: 104px; text-align: center; color: #c9d1da; white-space: nowrap; }
  .ico-bt { padding: 6px; border: none; background: transparent; }
  #dica { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); background: var(--ouro); color: #1a1408; font-weight: 700; padding: 8px 16px; border-radius: 20px; box-shadow: 0 4px 16px rgba(0,0,0,.35); }

  /* esquadrões (esquerda) */
  #esquadroes { position: absolute; top: 64px; left: 12px; width: 230px; max-height: calc(100vh - 150px); overflow: auto; display: flex; flex-direction: column; gap: 6px; }
  #esquadroes .titulo { display: flex; align-items: center; gap: 6px; color: var(--suave); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; padding: 0 2px; }
  #esquadroes .titulo .mini { margin-left: auto; }
  .card { background: var(--fundo); border: 1px solid var(--borda); border-left: 5px solid #6d8aa8; border-radius: 10px; padding: 7px 8px; cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 8px; position: relative; }
  .card:hover { background: rgba(30,38,48,.95); }
  .card.sel { outline: 2px solid var(--ouro); background: rgba(60,48,20,.92); }
  .card.perigo { border-left-color: #ff5a3a; } .card.anda { border-left-color: #6fb7ff; } .card.calmo { border-left-color: #8fd18f; }
  .c-meio { flex: 1; min-width: 0; } .card .nome { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-txt { font-size: 12px; color: var(--suave); margin: 1px 0 4px; display: flex; align-items: center; gap: 4px; } .c-txt .ico { font-size: 16px; }
  .card.perigo .c-txt { color: #ff9a7a; }
  .card .alerta { color: #ffb347; font-size: 22px; }
  .pips { display: flex; gap: 3px; flex-wrap: wrap; }
  .pip { width: 9px; height: 9px; border-radius: 50%; background: var(--bom); }
  .pip.lider { box-shadow: 0 0 0 2px var(--ouro); } .pip.ferido { background: var(--ruim); } .pip.desarmado { background: transparent; border: 2px solid #ffb347; width: 5px; height: 5px; }
  .ret { display: inline-flex; flex: none; line-height: 0; } .ret svg { display: block; }
  .arma-ico { display: inline-flex; width: 38px; height: 16px; flex: none; vertical-align: middle; } .arma-ico svg { width: 100%; height: 100%; }
  .arma-ico.peq { width: 28px; height: 12px; }
  .divisas { display: inline-flex; color: var(--ouro); line-height: 0; } .divisas .ico { font-size: 16px; margin: 0 -4px; } .divisas .ico:first-child { margin-left: 0; }
  .divisas.recruta { font-size: 10px; color: var(--suave); line-height: 1; text-transform: uppercase; letter-spacing: .06em; }

  /* painel de contexto (direita) */
  #contexto { top: 64px; right: 12px; width: 320px; max-height: calc(100vh - 100px); overflow: auto; }
  .cab { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .cab .tt { flex: 1; min-width: 0; } .cab .titulo { font-size: 17px; font-weight: 700; } .cab .sub { font-size: 12px; color: var(--suave); }
  .cab .fechar { align-self: flex-start; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.07); border-radius: 12px; padding: 3px 10px 3px 7px; font-size: 12px; }
  .chip .ico { font-size: 16px; } .chip.chave { color: var(--ouro); }
  .ponto { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(255,255,255,.4); flex: none; }
  .link { color: var(--texto); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; border-bottom: 1px dashed rgba(255,255,255,.4); }
  .link .ico { font-size: 16px; }
  .grade { display: flex; flex-direction: column; gap: 2px; }
  .linha { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 13px; }
  .linha .ico { font-size: 18px; color: var(--suave); } .linha .r { color: var(--suave); flex: 1; } .linha .v { text-align: right; }
  .acoes { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  .acoes button { justify-content: center; }
  .acoes-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 6px; margin-top: 12px; }
  .grande-bt { flex-direction: column; justify-content: center; gap: 2px; padding: 8px 6px; min-width: 84px; text-align: center; line-height: 1.15; }
  .grande-bt .ico { font-size: 26px; } .grande-bt .arma-ico { width: 44px; height: 20px; margin: 3px 0; }
  .grande-bt b { font-size: 13px; } .grande-bt small { font-size: 10.5px; color: var(--suave); }
  .grande-bt small.motivo { color: #f0a35a; } .grande-bt:disabled { opacity: .55; }
  .grande-bt.ativo { background: var(--ouro); color: #1a1408; border-color: var(--ouro); opacity: 1; } .grande-bt.ativo small { color: #3b2c08; }
  .grande-bt.ataque:not(.ativo) .ico { color: #ff8a5a; } .grande-bt.defesa:not(.ativo) .ico { color: #6fb7ff; }
  .grande-bt.modo.ataque.ativo { background: #e0603a; border-color: #ff8a5a; color: #fff; } .grande-bt.modo.ataque.ativo small { color: #ffe0d0; }
  .grande-bt.modo.defesa.ativo { background: #2f78c4; border-color: #6fb7ff; color: #fff; } .grande-bt.modo.defesa.ativo small { color: #d8ecff; }
  .grande-bt.destaque { border-color: #ffb347; box-shadow: 0 0 0 2px rgba(255,179,71,.35); }
  .grande-bt.largo { grid-column: 1 / -1; }
  .ficha-arma { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.06); border-radius: 8px; padding: 8px 10px; margin: 6px 0; font-size: 13px; }
  .ficha-arma .arma-ico { width: 54px; height: 22px; color: #e9edf2; } .ficha-arma .peq { font-size: 12px; color: var(--suave); }
  .ficha-arma.sem { background: rgba(255,140,60,.15); color: #ffb37a; }
  .secao { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.1); }
  .barra { display: flex; align-items: center; gap: 8px; font-size: 12px; margin: 4px 0; }
  .barra .ico { font-size: 17px; color: var(--suave); } .barra .r { width: 100px; color: var(--suave); }
  .barra .fundo, .item .fundo { flex: 1; height: 6px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; }
  .barra .cheio, .item .cheio { height: 100%; background: var(--ouro); }
  .barra .num { width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
  .barra-zona { display: flex; gap: 3px; margin: 2px 0 6px; } .barra-zona i { flex: 1; height: 8px; border-radius: 3px; }
  .chaves { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
  .chave { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .chave:hover { background: rgba(255,255,255,.07); } .chave .n { flex: 1; } .chave .d { color: var(--suave); font-size: 12px; } .chave .def { color: #f0a35a; font-size: 18px; }
  .nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 6px 0; }
  .num-caixa { background: rgba(255,255,255,.05); border-radius: 6px; padding: 6px; text-align: center; display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--suave); }
  .num-caixa b { font-size: 16px; color: var(--texto); }
  .diario { margin: 8px 0 0; padding-left: 16px; font-size: 12px; color: #c9d1da; line-height: 1.5; }

  /* barra de ordens (embaixo) */
  #ordens { bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; align-items: flex-end; gap: 8px; padding: 4px 8px 6px 10px; border-radius: 18px; max-width: calc(100vw - 340px); }
  #ordens > .o-titulo, #ordens > .acao, #ordens > .o-ajuda { align-self: center; margin-top: 10px; }
  .o-titulo { font-weight: 700; color: var(--ouro); display: flex; align-items: center; gap: 6px; font-size: 13px; margin-right: 4px; white-space: nowrap; }
  #ordens button { border-radius: 18px; padding: 5px 10px; font-size: 12.5px; gap: 4px; } #ordens .ico { font-size: 18px; }
  .seg { display: flex; background: rgba(255,255,255,.06); border-radius: 18px; padding: 2px; }
  .seg button { border: none; background: transparent; }
  .seg .modo.ataque.ativo { background: #e0603a; color: #fff; } .seg .modo.defesa.ativo { background: #2f78c4; color: #fff; }
  .seg .modo.ataque:not(.ativo) .ico { color: #ff8a5a; } .seg .modo.defesa:not(.ativo) .ico { color: #6fb7ff; }
  #ordens .destaque { border-color: #ffb347; box-shadow: 0 0 0 2px rgba(255,179,71,.35); }
  .o-grupo { display: flex; flex-direction: column; align-items: center; gap: 1px; } .o-rot { font-size: 9.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--suave); }
  .seg .missao.ativo { background: var(--ouro); color: #1a1408; } .seg .missao:not(.ativo) .ico { color: var(--ouro); }
  .seg .postura.ativo { background: #4a5a6c; color: #fff; } .seg .postura.agressivo.ativo { background: #b8472c; } .seg .postura.cauteloso.ativo { background: #3d7a52; }
  #ordens .acao.ativo { background: #4a5a6c; }
  .o-ajuda { color: var(--suave); padding: 0 4px; cursor: help; } .o-ajuda .ico { font-size: 18px; }

  /* avisos */
  #avisos { position: absolute; left: 12px; bottom: 12px; width: 300px; display: flex; flex-direction: column-reverse; gap: 4px; }
  #av-recolhe { align-self: flex-start; background: var(--fundo); border-radius: 12px; padding: 1px 8px; }
  #avisos.aberto #av-recolhe .ico { transform: rotate(180deg); }
  #avisos-lista { display: flex; flex-direction: column; gap: 3px; }
  #avisos:not(.aberto) .aviso-item:nth-child(n+4) { display: none; }
  #avisos.aberto #avisos-lista { max-height: 50vh; overflow: auto; background: var(--fundo); border-radius: 8px; padding: 4px; }
  #avisos.piscando .aviso-item:first-child { box-shadow: 0 0 0 2px rgba(242,178,51,.5); }
  .aviso-item { display: flex; align-items: center; gap: 6px; border-left: 3px solid; border-radius: 6px; padding: 4px 7px; font-size: 12px; background: var(--fundo); transition: background 1s; }
  .aviso-item.novo { background: rgba(60,66,76,.95); } .aviso-item .ico { font-size: 16px; }
  .aviso-item .txt { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #avisos.aberto .aviso-item .txt { white-space: normal; }
  .aviso-item .hora { font-size: 10px; color: var(--suave); font-variant-numeric: tabular-nums; } .aviso-item .ir { display: none; }
  .aviso-item.clicavel:hover { background: rgba(50,58,70,.98); }

  /* janelas */
  #modal { top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(900px, 94vw); max-height: 84vh; z-index: 10; display: flex; flex-direction: column; }
  .j-corpo { overflow: auto; min-height: 0; padding-right: 4px; }
  .dica-j { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #c9d1da; background: rgba(255,255,255,.05); border-radius: 8px; padding: 7px 10px; margin: 8px 0; }
  .dica-j.alerta { background: rgba(255,140,60,.15); color: #ffc08a; }
  .arsenal { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 6px 0; }
  .a-item { background: rgba(255,255,255,.06); border-radius: 8px; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--suave); text-align: center; }
  .a-item .arma-ico { width: 52px; height: 22px; color: #e9edf2; } .a-item b { font-size: 18px; color: var(--texto); } .a-item.zero { opacity: .5; }
  .duas-col { display: grid; grid-template-columns: 1fr 280px; gap: 14px; }
  .secao-esq { border: 1px solid var(--borda); border-radius: 10px; padding: 8px; margin-bottom: 8px; transition: background .2s; }
  .secao-esq.aceita, .novo-esq.aceita { border: 1px dashed var(--bom); } .secao-esq.recusa, .novo-esq.recusa { opacity: .45; } .sobre { background: rgba(143,209,143,.15) !important; }
  .esq-tit { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; } .esq-tit span:not(.ico) { color: var(--suave); font-size: 12px; flex: 1; }
  .esq-tit.perigo .ico { color: #ff7a5a; } .esq-tit.calmo .ico { color: #8fd18f; } .esq-tit.anda .ico { color: #6fb7ff; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
  .tile { background: rgba(255,255,255,.05); border: 1px solid transparent; border-radius: 10px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    cursor: grab; position: relative; text-align: center; user-select: none; }
  .tile:hover { background: rgba(255,255,255,.1); } .tile.sel { border-color: var(--ouro); background: rgba(60,48,20,.7); } .tile.lider { box-shadow: inset 0 0 0 1px rgba(242,178,51,.5); }
  .tile .estrela { position: absolute; top: 4px; right: 6px; color: var(--ouro); font-size: 18px; }
  .t-nome { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .t-fun { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--suave); } .t-fun .ico { font-size: 15px; } .t-fun .arma-ico { width: 30px; height: 12px; color: #c9d1da; }
  .t-sem { display: flex; align-items: center; gap: 2px; font-size: 10.5px; color: #ffb37a; } .t-sem .ico { font-size: 14px; }
  .tile.ferido { cursor: default; opacity: .8; }
  .novo-esq { display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px dashed rgba(255,255,255,.25); border-radius: 10px; padding: 14px; color: var(--suave); margin-bottom: 8px; }
  .col-dir { background: rgba(255,255,255,.04); border-radius: 10px; padding: 10px; align-self: start; position: sticky; top: 0; }
  .col-dir .vazio { color: var(--suave); font-size: 13px; text-align: center; padding: 40px 10px; }
  .ficha-cab { display: flex; align-items: center; gap: 10px; } .ficha-cab .titulo { font-weight: 700; font-size: 16px; } .ficha-cab .sub { font-size: 12px; color: var(--suave); display: flex; align-items: center; }
  .funcoes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin: 4px 0 8px; } .funcoes .grande-bt { min-width: 0; padding: 6px 3px; }
  .rec-grade { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .rec-cartao, .pais { background: rgba(255,255,255,.05); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .rc-tit { display: flex; align-items: center; gap: 8px; font-size: 15px; } .rc-tit .ico { color: var(--ouro); }
  .rc-custo { display: flex; align-items: center; gap: 5px; font-weight: 700; } .rc-custo .ico { font-size: 18px; color: var(--ouro); }
  .rc-info { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: #c9d1da; } .rc-info div { display: flex; align-items: center; gap: 6px; } .rc-info .ico { font-size: 16px; color: var(--suave); }
  .rec-cartao .largo, .pais .largo { margin-top: 2px; }
  .motivo { font-size: 12px; color: #f0a35a; }
  .presos { display: flex; flex-direction: column; gap: 4px; } .preso { display: flex; align-items: center; gap: 8px; } .pr-tt { flex: 1; display: flex; flex-direction: column; font-size: 12px; } .pr-tt span { color: var(--suave); font-size: 11px; }

/* ============================================================
   BASE: sorteio com semente, ruído e geometria 2D
   ============================================================ */
function criaSorteio(texto) {
  let h = 1779033703 ^ texto.length;
  for (let i = 0; i < texto.length; i++) { h = Math.imul(h ^ texto.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  let a = h >>> 0;
  const r = function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  r.entre = (min, max) => min + r() * (max - min);
  r.int = (min, max) => Math.floor(r.entre(min, max + 1));
  r.de = lista => lista[Math.floor(r() * lista.length)];
  r.pesado = pares => {
    let total = 0; for (const p of pares) total += p[1];
    let x = r() * total;
    for (const p of pares) { x -= p[1]; if (x <= 0) return p[0]; }
    return pares[0][0];
  };
  return r;
}

/* Ruído suave (value noise) com semente; devolve valores entre -1 e 1 */

/* Coloca um edifício solto (sem precisar de via) perto de um ponto */

/* ---------- zonas: a unidade de controle do território ---------- */

  for (const q of reg.velha.quarteiroes) nova("velha", q, q.nome, q.sig, Math.cos(q.a) * reg.Rv * .6, Math.sin(q.a) * reg.Rv * .6);

  for (const v of reg.lugares) if (v.tipo === "vila") nova("vila", v, v.nome, v.sig, v.x, v.z);

    const x = r.entre(-METADE + 150, METADE - 150), z = r.entre(-METADE + 150, METADE - 150);
    if (Math.hypot(x, z) < reg.cidade.Rout(Math.atan2(z, x)) + 300) continue;
    if (reg.lugares.some(l => l.tipo === "vila" && Math.hypot(l.x - x, l.z - z) < 480)) continue;
    if (reg.rurais.some(s => Math.hypot(s.x - x, s.z - z) < 650)) continue;
    const s = Object.assign({ k: reg.rurais.length, x, z }, nomeBairro(r, usados, r.de(["Wadi", "Marj", "Jabal"]), "Campo"));
    s.sig = { Wadi: "Vale", Marj: "Prado", Jabal: "Monte" }[s.nome.split(" ")[0]] + " " + s.sig.replace("Campo ", "");

  reg.zonas = reg.zonas.filter(zn => zn.edificios.length > 0);

/* ---------- sítios das vilas (no alto dos morros, como no sul do Líbano) ---------- */
function escolheSitiosVilas(reg, r) {
  const cands = [];
  for (let t = 0; t < 600; t++) {
    const a = r.entre(0, 6.28), d = r.entre(820, 1220), x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (Math.abs(x) > METADE - 200 || Math.abs(z) > METADE - 200) continue;
    if (distRio(reg, x, z) < 220 || declive(reg, x, z).m > .22) continue;
    cands.push({ x, z, a, nota: alturaEm(reg, x, z) + r.entre(0, 50) });
  }
  cands.sort((p, q) => q.nota - p.nota);
  const sitios = [];
  for (const c of cands) {
    if (sitios.length >= 3) break;
    if (sitios.some(s => Math.hypot(s.x - c.x, s.z - c.z) < 750 || difAng(s.a, c.a) < 1.1)) continue;
    sitios.push(c);
  }

/* ---------- vilas ---------- */
function geraVila(reg, r, usados, s, viaChegada) {
  const oc = reg.oc, nv = criaRuido(r);
  const vila = Object.assign({ tipo: "vila", x: s.x, z: s.z, angCampo: r.entre(0, Math.PI) }, nomeLugar(r, usados, INICIO_VILA));
  reg.lugares.push(vila);
  const local = { lugar: vila, bairro: null };
  const fluxo = (x, z) => Math.PI * .6 * nv(x / 90, z / 90) + vila.angCampo;
  novoEdificio(reg, "mesquita", criaObb(s.x, s.z, fluxo(s.x, s.z), 19, 21), Object.assign({}, local));
  // Trilhas de terra saindo do centro, procurando o caminho menos íngreme

    let h = t0 + i * 2 * Math.PI / nT + r.entre(-.3, .3), x = s.x + Math.cos(h) * 12, z = s.z + Math.sin(h) * 12;

      for (const dh of [-.35, 0, .35]) {

        const c = Math.abs(alturaEm(reg, nx, nz) - alturaEm(reg, x, z)) + r.entre(0, .6);
        if (c < mc) { mc = c; melhor = [hh, nx, nz]; }

      if (Math.abs(x) > METADE - 40 || Math.abs(z) > METADE - 40 || distRio(reg, x, z) < reg.rio.larg + 15) break;
      pts.push([x, z]);
      if (k > 4 && oc.viaPerto(x, z, 3, null)) break;

    const a = r.entre(0, 6.28), d = 12 + Math.sqrt(r()) * 42, x = s.x + Math.cos(a) * d, z = s.z + Math.sin(a) * d;
    const w = r.entre(7, 13), dd = r.entre(7, 12);

    if (!oc.livre(o, .9, .6)) continue;

    const e = novoEdificio(reg, tipo, o, Object.assign({ andares: r.pesado([[1, 4], [2, 4]]), velha: true }, local));
    cresce(reg, e, 4, .9, .6);

/* ---------- campos, pomares e olivais ---------- */
function poeCampo(reg, r, o, tipo, cor) {
  reg.oc.poeCampo(o);
  const c = { o, tipo, cor };
  reg.campos.push(c);
  if (tipo === "olival" || tipo === "pomar") {
    const esp = tipo === "pomar" ? 8 : 7;
    for (let u = -o.hw + esp / 2; u < o.hw - 1; u += esp) for (let v = -o.hd + esp / 2; v < o.hd - 1; v += esp) {
      if (r() < .08) continue;
      const [du, dv] = gira(u + r.entre(-.8, .8), v + r.entre(-.8, .8), o.a);
      reg.arvores.push({ tipo: tipo === "pomar" ? "palma" : "oliva", x: o.x + du, z: o.z + dv, s: r.entre(.8, 1.15) });
    }
  }

}
function campoCabe(reg, o, margem) {
  if (!reg.oc.campoLivre(o, margem) || !reg.oc.livre(o, 3, 2)) return false;
  for (const [x, z] of cantosObb(o)) {
    if (Math.abs(x) > METADE - 10 || Math.abs(z) > METADE - 10) return false;
    if (distRio(reg, x, z) < reg.rio.larg + 6) return false;
    const d = Math.hypot(x, z); if (d < reg.cidade.Rout(Math.atan2(z, x)) + 20) return false;
  }

/* Um bloco de terra dividido em parcelas coladas umas nas outras (como nas fotos de satélite).

  const g0 = declive(reg, cx, cz), terraco = g0.m > .08;
  const ang = terraco ? Math.atan2(g0.gx, -g0.gz) : angPlano;
  let u = -W / 2;
  while (u < W / 2 - 12) {
    const cw = terraco ? r.entre(45, 95) : r.entre(20, 58);
    let v = -D / 2;
    while (v < D / 2 - 8) {
      const ch = terraco ? r.entre(10, 18) : r.entre(15, 46);
      const [du, dv] = gira(u + cw / 2, v + ch / 2, ang), x = cx + du, z = cz + dv;
      v += ch;

      if (terraco && difAng(Math.atan2(g.gx, -g.gz), ang) > .5 && difAng(Math.atan2(g.gx, -g.gz), ang + Math.PI) > .5) continue;

      if (!campoCabe(reg, o, .4)) continue;

function geraCampos(reg, r) {
  // em volta das vilas
  for (const vl of reg.lugares) if (vl.tipo === "vila") for (let t = 0; t < 14; t++) {
    const a = r.entre(0, 6.28), d = r.entre(90, 400);
    parcelamento(reg, r, vl.x + Math.cos(a) * d, vl.z + Math.sin(a) * d, r.entre(140, 280), r.entre(100, 220), vl.angCampo + (r() < .3 ? Math.PI / 2 : 0), .3);
  }
  // em volta da cidade, nas partes mais planas
  for (let t = 0; t < 70; t++) {
    const a = r.entre(0, 6.28), d = reg.cidade.Rout(a) + r.entre(60, 520), x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (declive(reg, x, z).m > .2) continue;
    parcelamento(reg, r, x, z, r.entre(150, 300), r.entre(110, 230), a + r.entre(-.3, .3), .22);
  }
  // faixas irrigadas nas margens do rio, com pomares de tamareiras
  for (let z = -METADE + 20; z < METADE - 20; z += r.entre(18, 30)) for (const lado of [-1, 1]) {
    if (r() < .2) continue;

/* ---------- vegetação ---------- */
function geraArvores(reg, r) {
  const oc = reg.oc, nt = criaRuido(r);
  const foraDaCidade = (x, z) => Math.hypot(x, z) > reg.cidade.Rout(Math.atan2(z, x)) + 10;
  const longeDasVilas = (x, z, d) => !reg.lugares.some(l => l.tipo === "vila" && Math.hypot(l.x - x, l.z - z) < d);
  // tamareiras nas margens do rio
  for (let z = -METADE; z < METADE; z += r.entre(4, 9)) for (const lado of [-1, 1]) {
    if (nt(z / 120, lado * 3) < -.15) continue;
    const x = xDoRio(reg, z) + lado * (reg.rio.larg + r.entre(2, 9));
    if (oc.edificioPerto(x, z, 2) || oc.viaPerto(x, z, 2)) continue;
    reg.arvores.push({ tipo: "palma", x, z, s: r.entre(.8, 1.25) });
  }
  // árvores no pátio das casas e ao longo das avenidas
  for (const e of reg.edificios) if (e.patio && r() < .45) reg.arvores.push({ tipo: "citrico", x: e.x, z: e.z, s: r.entre(.7, 1), base: true });
  for (const via of reg.vias) if (via.tipo === "avenida" && via.larg >= 11) {
    const L = via.L[via.L.length - 1];
    for (let t = 5; t < L; t += r.entre(9, 14)) for (const lado of [-1, 1]) {
      const p = pontoEm(via, t), off = via.larg / 2 + 1.6, x = p.x - p.tz * lado * off, z = p.z + p.tx * lado * off;
      if (r() < .3 || oc.edificioPerto(x, z, 1.5)) continue;

    }
  }
  // ciprestes nos cemitérios
  for (const c of reg.cemiterios) for (let i = 0; i < 26; i++) {
    const [u, v] = gira(r.entre(-c.hw + 2, c.hw - 2), r.entre(-c.hd + 2, c.hd - 2), c.a);
    reg.arvores.push({ tipo: "cipreste", x: c.x + u, z: c.z + v, s: r.entre(.8, 1.2) });
  }
  // pinheiros no alto dos morros
  for (let t = 0; t < 9000; t++) {
    const x = r.entre(-METADE + 20, METADE - 20), z = r.entre(-METADE + 20, METADE - 20);
    if (alturaEm(reg, x, z) < 115 || nt(x / 160, z / 160) < .15 || !foraDaCidade(x, z) || !longeDasVilas(x, z, 90)) continue;
    if (oc.noCampo(x, z) || oc.viaPerto(x, z, 4)) continue;
    reg.arvores.push({ tipo: "pinheiro", x, z, s: r.entre(.75, 1.3) });
  }
  // arbustos secos espalhados
  for (let t = 0; t < 14000; t++) {
    const x = r.entre(-METADE + 10, METADE - 10), z = r.entre(-METADE + 10, METADE - 10);
    if (nt(x / 90 + 30, z / 90) < -.1 || !foraDaCidade(x, z) || !longeDasVilas(x, z, 60)) continue;
    if (distRio(reg, x, z) < reg.rio.larg + 2 || oc.noCampo(x, z) || oc.viaPerto(x, z, 3) || oc.edificioPerto(x, z, 3)) continue;
    reg.arvores.push({ tipo: "arbusto", x, z, s: r.entre(.5, 1.3) });
  }
}

/* ---------- quartel e casas isoladas ---------- */
function geraQuartel(reg, r) {
  const rod = reg.vias.filter(v => v.tipo === "rodovia");
  for (let t = 0; t < 600; t++) {
    const via = r.de(rod); if (!via) return;
    const L = via.L[via.L.length - 1], p = pontoEm(via, r.entre(0, L)), d = Math.hypot(p.x, p.z), ro = reg.cidade.Rout(Math.atan2(p.z, p.x));
    if (d < ro + 60 || d > ro + 420) continue;
    const lado = r() < .5 ? -1 : 1, off = r.entre(110, 160), x = p.x - p.tz * lado * off, z = p.z + p.tx * lado * off;
    const o = criaObb(x, z, Math.atan2(p.tz, p.tx), 170, 128);
    if (desnivel(reg, o) > 9 || !reg.oc.livre(o, 6, 6) || distRio(reg, x, z) < 120) continue;

  if (w.supressao) for (const o of P.soldados) if (o.vida === "ok" && o.faccao === alvo.faccao && Math.hypot(o.x - ix, o.z - iz) < 4) o.sobFogo = Math.max(o.sobFogo, 2);
}

/* ---------- explosão ----------
   Acerta quem está no raio, menos quem tem parede ou prédio no meio.
   Dentro de um prédio, quem está no mesmo prédio do impacto leva em cheio
   (o RPG mais que a granada). Também machuca soldados do próprio lado
   e estraga o prédio atingido. */
function explode(P, s, w, ix, iz, mult) {
  w = Object.assign({}, w, { area: w.area * (mult || 1) });
  let predio = null;
  P.reg.oc.edificiosPerto(ix, iz, 4, e => { if (!predio && pontoNoObb(e.o, ix, iz, 1.5)) predio = e; });
  if (predio) danificaPredio(P, predio, w.danoPredio || 0, s);
  const raioDentro = w.area * 1.5;
  for (const o of P.soldados) {
    if (o.vida !== "ok" || o === s) continue;
    const dd = Math.hypot(o.x - ix, o.z - iz); if (dd > 9) continue;
    const amigo = o.faccao === s.faccao;
    if (!amigo && dd < 8) { o.sobFogo = Math.max(o.sobFogo, 2); if (o.sq) entraEmCombate(P, o.sq); }
    let fator;
    if (o.dentro && o.dentro === predio) { if (dd > raioDentro) continue; fator = w.contraPredio * (predio.destruido ? 1 : 1 - .3 * (predio.fortificado || 0)) * (1 - dd / raioDentro * .5); }
    else {
      if (dd > w.area) continue;
      if (o.dentro && !o.dentro.destruido) fator = .25;                                  // as paredes do prédio dele seguram quase tudo
      else if (P.reg.oc.linhaCortada(ix, iz, o.x, o.z, 1.2)) continue;                    // prédio ou muro no meio: protegido
      else fator = 1;
      fator *= 1 - dd / w.area * .5;
    }
    if (P.r() < .65 * fator) atingido(P, o, s, amigo);
  }
}
const DANO_DESTROI = 1;
function danificaPredio(P, e, dano, s) {
  if (!dano || e.destruido) return;
  const tamanho = e.w * e.d * Math.max(1, e.andares || 1);
  e.dano = Math.min(DANO_DESTROI, (e.dano || 0) + dano * limita(120 / tamanho, .12, 1.5));
  if (e.fortificado) e.fortificado = Math.max(0, e.fortificado - dano);
  if (e.dano >= DANO_DESTROI) { e.destruido = true; avisa(P, "destruido", { e, s }); }
  else avisa(P, "dano", { e });
}

function tiraDoEsquadrao(P, o) {
  const sq = o.sq; if (!sq) return;
  sq.perdas++; sq.perdasNoCombate = (sq.perdasNoCombate || 0) + 1;
  for (const m of ativos(sq)) if (m !== o && Math.hypot(m.x - o.x, m.z - o.z) < 40) m.moral -= (o === sq.lider ? 15 : 8) * (1 - m.atr.coragem / 200);
  if (o.vida !== "ferido") { sq.membros = sq.membros.filter(m => m !== o); o.sqAntes = sq; o.sq = null; }
  if (sq.lider === o) escolheLider(P, sq);
}
function atingido(P, o, s, amigo) {
  if (o.vida !== "ok") return;
  if (!amigo) { registraLuta(P, o.faccao, s.faccao); mudaRelacao(P, o.faccao, s.faccao, DIPLO.ferir); }
  if (!amigo) { s.acertos++; aprende(P, s, "pontaria", 2.5, "acertou um inimigo"); }
  const medico = o.sq && ativos(o.sq).some(m => m.funcao === "medico" && m.item === "kit" && m !== o && Math.hypot(m.x - o.x, m.z - o.z) < 40);
  const fatal = P.r() < Math.min(.6, (medico ? .14 : .3) * (s.arma ? NIVEL.dano[(s.nivel || 1) - 1] : 1) * bonusDe(o).fatal);   // arma melhor mata mais; veterano sabe se proteger   // arma melhor, ferimento pior
  o.ferimentos++; o.caiuEm = P.tempo; o.destino = null;
  const por = amigo ? "fogo amigo de " + s.nome : s.nome + " (" + s.faccao.nome + ")";
  if (fatal) { o.vida = "morto"; if (!amigo) { s.abates++; aprende(P, s, "pontaria", 3); } anota(P, o, "Morto por " + por); }
  else { o.vida = "ferido"; anota(P, o, "Ferido por " + por + (medico ? "; o médico estancou o sangramento" : "")); }
  if (amigo) { anota(P, s, "Acertou " + o.nome + ", do próprio lado, com uma explosão"); avisa(P, "fogoamigo", { o, s, fatal }); }
  tiraDoEsquadrao(P, o);
  if (s.sq && !amigo) for (const m of ativos(s.sq)) m.moral = Math.min(moralMax(m) + 10, m.moral + 3);
  avisa(P, "baixa", { o, s, fatal });
}
/* o médico trata o ferido ali mesmo: ferimento leve volta a lutar */
const CHANCE_LEVE = .6, USOS_KIT = 3;
function trataNoCampo(P, m, o) {
  m.tempoTrat = 0; m.paciente = null; o.medico = null;
  const nk = (m.nivelItem || 1) - 1;
  m.usosKit = (m.usosKit == null ? NIVEL.kitUsos[nk] : m.usosKit) - 1;
  if (m.usosKit <= 0) { m.item = null; m.usosKit = null; anota(P, m, "O kit médico acabou; precisa de outro no QG"); avisa(P, "kitacabou", { s: m }); }
  aprende(P, m, "coragem", 1.5, "tratou um ferido sob fogo");
  if (P.r() < NIVEL.kitLeve[nk]) {
    o.vida = "ok"; o.moral = Math.max(o.moral, o.atr.coragem + 5); o.caiuEm = 0;
    if (!o.sq) { const sq = o.sqAntes || m.sq; if (sq) entraNoEsquadrao(sq, o); }
    anota(P, o, "Tratado no campo por " + m.nome + "; voltou a lutar");
    avisa(P, "tratadocampo", { s: o, m });
  } else { anota(P, o, "Ferimento grave: " + m.nome + " estabilizou, mas precisa de hospital"); o.caiuEm = P.tempo - 5; }
}
function rende(P, s, captor) {
  s.vida = "rendido"; s.caiuEm = P.tempo; s.destino = null;
  captor.prisioneiros.push(s);
  if (captor.arsenal) { if (s.arma) captor.arsenal[chave(s.arma, s.nivel || 1)]++; if (s.item) captor.arsenal[chave(s.item, s.nivelItem || 1)]++; if (s.arma && captor.municao) captor.municao[MUNICAO_DA[s.arma]] += Math.floor(s.municao); }
  s.arma = null; s.item = null; s.municao = 0;
  anota(P, s, "Rendeu-se a " + captor.nome + "; as armas ficaram com eles");
  tiraDoEsquadrao(P, s);
  avisa(P, "rendicao", { s, captor });
}

/* ---------- o esquadrão em combate ---------- */
function combateDoEsquadrao(P, sq, dt) {
  const inimigos = inimigosPerto(P, sq);
  if (P.tempo >= sq.proximoPlano) planoDoLider(P, sq);
  sq.semContato += dt;
  for (const s of ativos(sq)) {
    s.pensa -= dt;
    if (s.pensa <= 0) { s.pensa = .5 + P.r() * .2; pensa(P, s, sq, inimigos); }
    if (s.vida === "ok") age(P, s, sq, dt);
  }
  if (!ativos(sq).length) return;
  if (sq.semContato > 10) saiDoCombate(P, sq);
}

/* ---------- tomar prédio defendido ---------- */
function verificaCapturas(P) {
  for (const sq of P.esquadroes) {
    const e = sq.alvo || sq.sub || (sq.ordem.tipo === "avancar" ? sq.ordem.alvo : null);
    if (!e || !sq.combate || !podeTomar(P, sq.faccao, e)) continue;
    if (defensores(P, e, sq.faccao).length) continue;
    if (!ativos(sq).some(s => pontoNoObb(e.o, s.x, s.z, 8))) continue;
    if (sq.sub === e) { tomaEdificio(P, e, sq.faccao); if (sq.ordem.visitados) sq.ordem.visitados.add(e); sq.sub = null; sq.alvo = null; }
    else ocupa(P, sq, e);
  }
}

"use strict";
/* ============================================================
   ECONOMIA: dinheiro, influência e comida
   Contas por hora de jogo. Cada facção (menos o governo, que só
   tem o caixa negativo) recebe e gasta a cada hora.
   ============================================================ */
const RECURSOS_INICIAIS = { dinheiro: 3000, influencia: 20, comida: 200 };
// imposto fixo por prédio ($ por hora)
const IMPOSTO = { casa: 2, predio: 0, loja: 8, mercado: 14, posto: 20, oficina: 6, armazem: 10, fabrica: 18, fazenda: 3, lider: 4, mesquita: 0, escola: 0, hospital: 0, delegacia: 0, governo: 0, quartel: 0, cidadela: 0, caixadagua: 0 };
const IMPOSTO_POR_ANDAR = 1.5;           // prédio residencial: por andar
// comida produzida por hora
const COMIDA = { fazenda: 20, armazem: 6, mercado: 4 };
const COMIDA_POR_CAMPO = .4;             // cada roça, pomar ou olival numa zona com controle total
// influência por hora
const INFLUENCIA = { mesquita: 1, lider: 2, escola: .5, hospital: .5 };
const INFLUENCIA_ZONA = 1.5;             // por zona com controle total
const BONUS_CONTROLE_TOTAL = .25;        // +25% de imposto nos prédios de zona com controle total
const SALARIO = 5;                       // $ por soldado por hora
const MANUTENCAO = { qg: 15, lider: 8, avancada: 4 };   // $ por hora por base
const COME_SOLDADO = .1, COME_MORADOR = .04;   // comida por pessoa por hora
const DISTRIBUIR = { comida: 50, influencia: 8 };
const CONVENCER = { casa: 24, predio: 36, chave: 120, governo: 1.5 };   // custo em influência (×1,5 se for do governo)

function moradoresDe(e) {
  if (e.destruido) return 0;
  if (e.tipo === "casa") return e.patio ? 8 : e.murada ? 6 : 5;
  if (e.tipo === "predio") return e.andares * 6;
  return { loja: 2, lider: 12, fazenda: 6, mercado: 0 }[e.tipo] || 0;
}
function impostoDe(e) { if (e.destruido) return 0; return e.tipo === "predio" ? IMPOSTO_POR_ANDAR * e.andares : IMPOSTO[e.tipo] || 0; }

/* Contas da facção por hora, item por item (para o painel mostrar de onde vem cada número) */
function contas(P, fac) {
  const c = { dinheiro: [], influencia: [], comida: [] };
  const soma = {};
  const add = (rec, rotulo, v) => { if (!v) return; const k = rec + "|" + rotulo; soma[k] = (soma[k] || 0) + v; };
  let moradores = 0, semComida = 0, campos = 0;
  const zonasMinhas = new Set(P.reg.zonas.filter(z => z.dono === fac));
  for (const e of P.reg.edificios) {
    if (e.dono !== fac) continue;
    const bonus = zonasMinhas.has(e.zona) ? 1 + BONUS_CONTROLE_TOTAL : 1;
    const conf = fatorImposto(fac, e.zona);
    add("dinheiro", "Imposto: " + TIPOS[e.tipo].n.toLowerCase(), impostoDe(e) * bonus * conf);
    add("comida", "Produção: " + TIPOS[e.tipo].n.toLowerCase(), comidaDoPredio(e));
    add("influencia", TIPOS[e.tipo].n, INFLUENCIA[e.tipo] || 0);
    if (alimenta(fac, e.zona)) moradores += moradoresDe(e); else semComida += moradoresDe(e);
  }
  for (const cp of P.reg.campos) { const zn = zonaDe(P.reg, cp.o.x, cp.o.z); if (zonasMinhas.has(zn)) campos++; }
  add("comida", "Roças e pomares (" + campos + ")", campos * COMIDA_POR_CAMPO);
  add("influencia", "Zonas com controle total (" + zonasMinhas.size + ")", zonasMinhas.size * INFLUENCIA_ZONA);
  const tropa = P.soldados.filter(s => s.faccao === fac && ["ok", "ferido", "tratando", "fila", "reserva", "motorista"].includes(s.vida)), soldados = tropa.length;
  add("dinheiro", "Salário de " + soldados + " soldados", -tropa.reduce((n, s) => n + salarioDe(s), 0));
  if (fac.base) {
    add("dinheiro", "Manutenção do QG", -MANUTENCAO.qg);
    const bl = new Set(batalhoesDe(P, fac).map(b => b.base).filter(e => e && e !== fac.base));
    if (bl.size) add("dinheiro", "Manutenção das bases dos líderes (" + bl.size + ")", -bl.size * MANUTENCAO.lider);
    const av = P.reg.edificios.filter(e => e.dono === fac && e.tipo === "lider" && e !== fac.base && !bl.has(e)).length;
    if (av) add("dinheiro", "Manutenção das bases avançadas (" + av + ")", -av * MANUTENCAO.avancada);
  }
  add("comida", "Soldados comem (" + soldados + ")", -soldados * COME_SOLDADO);
  add("comida", "Moradores comem (" + moradores + ")", -moradores * COME_MORADOR);
  for (const [k, v] of Object.entries(soma)) { const [rec, rotulo] = k.split("|"); c[rec].push([rotulo, v]); }
  for (const rec of Object.keys(c)) c[rec].sort((a, b) => b[1] - a[1]);
  c.total = { dinheiro: 0, influencia: 0, comida: 0 };
  for (const rec of Object.keys(c.total)) for (const [, v] of c[rec]) c.total[rec] += v;
  c.moradores = moradores; c.semComida = semComida; c.soldados = soldados;
  return c;
}

function horaDaEconomia(P) {
  for (const fac of P.faccoes) {
    if (fac.governo || !fac.recursos) continue;
    const c = contas(P, fac), R = fac.recursos;
    R.dinheiro += c.total.dinheiro; R.influencia += c.total.influencia; R.comida += c.total.comida;
    const meus = P.soldados.filter(s => s.faccao === fac && s.vida === "ok");
    // sem dinheiro: sem salário, moral cai e alguns desertam
    if (R.dinheiro < 0) {
      for (const s of meus) {
        s.moral -= 5;
        if (P.r() < .02 * (1.3 - s.atr.disciplina / 100)) { anota(P, s, "Desertou: sem salário"); s.vida = "desertou"; s.caiuEm = P.tempo; tiraDoEsquadrao(P, s); avisa(P, "desercao", { s }); }
      }
      avisa(P, "falta", { fac, rec: "dinheiro" });
    }
    // sem comida: moral cai rápido e os bairros alimentados perdem a confiança
    const faltou = R.comida < 0;
    if (faltou) {
      R.comida = 0;
      for (const s of meus) s.moral -= 10;
      avisa(P, "falta", { fac, rec: "comida" });
    }
    horaDaConfianca(P, fac, faltou);
    horaDasObras(P, fac);
    if (!fac.jogador) obrasRival(P, fac);
    R.influencia = Math.max(0, R.influencia);
  }
}

/* ---------- ações ---------- */
function custoConvencer(e) {
  let c = TIPOS_CHAVE.includes(e.tipo) ? CONVENCER.chave : e.tipo === "predio" ? CONVENCER.predio : CONVENCER.casa;
  if (e.dono && e.dono.governo) c *= CONVENCER.governo;
  return Math.round(c);
}
/* Dá para convencer os moradores? (sem defensores, e a facção já tem algo perto) */
function podeConvencer(P, fac, e) {
  if (e.dono === fac) return "o prédio já é seu";
  if (e.dono && !e.dono.governo && (estadoEntre(P, fac, e.dono) === "pacto" || estadoEntre(P, fac, e.dono) === "alianca")) return "é de " + e.dono.nome + ", com quem você tem " + ESTADOS[estadoEntre(P, fac, e.dono)].n.toLowerCase();
  if (defensores(P, e, fac).length) return "tem guarnição inimiga";
  if (!moradoresDe(e) && !TIPOS_CHAVE.includes(e.tipo)) return "não tem moradores para convencer";
  const perto = P.reg.edificios.some(o => o.dono === fac && (o.zona === e.zona || Math.hypot(o.x - e.x, o.z - e.z) < 150));
  if (!perto) return "você não tem presença nesta área";
  if (fac.recursos.influencia < custoConvencer(e)) return "influência insuficiente";
  return null;
}
function convence(P, fac, e) {
  if (podeConvencer(P, fac, e)) return false;
  fac.recursos.influencia -= custoConvencer(e);
  tomaEdificio(P, e, fac);
  avisa(P, "convenceu", { fac, e });
  return true;
}
function distribuiComida(P, fac) {
  if (fac.recursos.comida < DISTRIBUIR.comida) return false;
  fac.recursos.comida -= DISTRIBUIR.comida; fac.recursos.influencia += DISTRIBUIR.influencia;
  avisa(P, "distribuiu", { fac });
  return true;
}

/* IA das rivais: convence prédios baratos perto e distribui comida quando sobra */
function economiaRival(P, fac) {
  const R = fac.recursos; if (!R) return;
  for (let i = 0; i < 3 && R.comida > 450; i++) distribuiComida(P, fac);
  for (let i = 0; i < 2 && R.influencia >= 40; i++) convenceAlgo(P, fac);
}
function convenceAlgo(P, fac) {
  const meus = P.reg.edificios.filter(e => e.dono === fac);
  let melhor = null, md = Infinity;
  for (const e of P.reg.edificios) {
    if (e.dono === fac || podeConvencer(P, fac, e)) continue;
    let d = Infinity; for (const m of meus) d = Math.min(d, Math.hypot(m.x - e.x, m.z - e.z));
    const nota = d - (TIPOS_CHAVE.includes(e.tipo) ? 80 : 0);
    if (nota < md) { md = nota; melhor = e; }
  }
  if (melhor) convence(P, fac, melhor);
}

"use strict";
/* ============================================================
   COMIDA: alimentar por bairro, obras no campo e comércio
   - Cada bairro seu tem "alimentar" ligado ou desligado. Quem não é
     alimentado não come, mas a confiança cai aos poucos e o bairro
     paga menos imposto (e não dá voluntários).
   - Obras (paga e espera): fazenda nova, armazém, expandir plantação
     e melhorar fazenda (nível I, II, III). Só em vilas e setores rurais.
   - Comércio: quem tem comida sobrando vende para quem está faltando,
     entre facções que não estão em guerra. O preço sobe quando falta
     comida no mapa e cai quando sobra. Se não houver quem venda,
     importa dos países (mais caro). Entrega na hora.
   (Números provisórios.)
   ============================================================ */
const CONFIANCA = { inicial: 100, sobeAlimentado: 3, caiSemComida: 4, caiFome: 6, minImposto: .3, voluntarios: 50 };
const OBRAS = {
  fazenda:   { n: "Construir fazenda", icone: "agriculture", custo: 1200, horas: 6, em: ["casa"], txt: "A casa vira fazenda (+20 de comida por hora)" },
  armazem:   { n: "Construir armazém", icone: "warehouse", custo: 900, horas: 4, em: ["casa", "loja"], txt: "Vira armazém (+6 de comida por hora)" },
  plantacao: { n: "Expandir plantação", icone: "grass", custo: 600, horas: 4, em: ["fazenda"], max: 3, txt: "+10 roças na fazenda (+5 de comida por hora)" },
  melhorar:  { n: "Melhorar fazenda", icone: "upgrade", custo: [0, 2400, 6000], horas: [0, 8, 12], em: ["fazenda"], txt: "Nível II: 1,7x a produção; nível III: 2,6x" }
};
const FAZENDA_NIVEL = [1, 1.7, 2.6];
const POR_PLANTACAO = 5;                 // comida por hora de cada expansão de plantação
const ZONAS_DE_CAMPO = ["vila", "rural"];
const MERCADO_COMIDA = { base: 2, minimo: 1, importa: 6, reserva: 40, horasDeFolga: 3, rivalVendeAcima: 180, rivalGuarda: 120, relacaoPor100: 1, colchao: 60 };

/* ---------- alimentar e confiança ---------- */
const alimenta = (fac, zn) => !(fac.semAlimentar && fac.semAlimentar.has(zn));
function trocaAlimentar(fac, zn) { fac.semAlimentar = fac.semAlimentar || new Set(); if (fac.semAlimentar.has(zn)) fac.semAlimentar.delete(zn); else fac.semAlimentar.add(zn); }
function confiancaEm(fac, zn) { return fac.confianca && fac.confianca.has(zn) ? fac.confianca.get(zn) : CONFIANCA.inicial; }
const fatorImposto = (fac, zn) => CONFIANCA.minImposto + (1 - CONFIANCA.minImposto) * confiancaEm(fac, zn) / 100;
function horaDaConfianca(P, fac, faltou) {
  fac.confianca = fac.confianca || new Map();
  const zonas = new Set(); for (const e of P.reg.edificios) if (e.dono === fac) zonas.add(e.zona);
  for (const zn of zonas) {
    const c = confiancaEm(fac, zn);
    const d = !alimenta(fac, zn) ? -CONFIANCA.caiSemComida : faltou ? -CONFIANCA.caiFome : CONFIANCA.sobeAlimentado;
    const n = Math.max(0, Math.min(100, c + d)); fac.confianca.set(zn, n);
    if (fac.jogador && c >= 50 && n < 50) avisa(P, "confianca", { fac, zona: zn });
  }
}

/* ---------- produção de cada prédio ---------- */
function comidaDoPredio(e) {
  if (e.destruido) return 0;
  if (e.tipo === "fazenda") return COMIDA.fazenda * FAZENDA_NIVEL[(e.nivel || 1) - 1] + (e.plantacao || 0) * POR_PLANTACAO;
  return COMIDA[e.tipo] || 0;
}

/* ---------- obras ---------- */
function custoObra(tipo, e) { const o = OBRAS[tipo]; return tipo === "melhorar" ? o.custo[e.nivel || 1] : o.custo; }
function horasObra(tipo, e) { const o = OBRAS[tipo]; return tipo === "melhorar" ? o.horas[e.nivel || 1] : o.horas; }
function motivoObra(P, fac, e, tipo) {
  const o = OBRAS[tipo];
  if (e.dono !== fac) return "o prédio não é seu";
  if (e.destruido) return "prédio destruído";
  if (!ZONAS_DE_CAMPO.includes(e.zona.tipo)) return "só em vilas e setores rurais";
  if (!o.em.includes(e.tipo)) return "não dá neste tipo de prédio";
  if ((fac.obras || []).some(x => x.e === e)) return "já tem obra aqui";
  if (fac.base === e || batalhoesDe(P, fac).some(b => b.base === e)) return "é uma base";
  if (tipo === "plantacao" && (e.plantacao || 0) >= o.max) return "plantação já no máximo";
  if (tipo === "melhorar" && (e.nivel || 1) >= 3) return "já está no nível III";
  if (fac.recursos.dinheiro < custoObra(tipo, e)) return "falta dinheiro";

}

  if (sq.fixo) return;
  // 2) caçada em curso: corrige o rumo se o alvo andou
  if (sq.caca && sq.estado === "andando") {
    const o = sq.caca.alvo;
    if (!ativos(o).length) sq.caca = null;
    else { const [x, z] = centroDoEsquadrao(o); if (Math.hypot(x - sq.caca.x, z - sq.caca.z) > 60) vaiAtacarEsquadrao(P, sq, o); return; }
  }
  if (sq.estado === "andando") return;
  sq.caca = null;
  // 3) socorrer (menos quem está apoiando ou caçando, que tem lógica própria)
  if (!m || m.tipo === "expandir" || m.tipo === "defender" || m.tipo === "frente") {
    const o = perigoDeAlguem(P, sq);
    if (o && (!m || m.tipo !== "defender" || zonaDe(P.reg, ...centroDoEsquadrao(o)) === m.alvo)) { vaiAtacarEsquadrao(P, sq, o, "socorro"); return; }
  }
  if (!m) { pegaFacil(P, sq); return; }
  if (m.tipo === "expandir") missaoExpandir(P, sq);
  else if (m.tipo === "defender") missaoDefender(P, sq);
  else if (m.tipo === "cacar") missaoCacar(P, sq);
  else if (m.tipo === "apoiar") missaoApoiar(P, sq);
  else if (m.tipo === "frente") missaoFrente(P, sq);
  else if (m.tipo === "ronda") missaoRonda(P, sq);
  else if (m.tipo === "reacao") missaoReacao(P, sq);
}

/* numa base: pega soldados que esperam ali até 6 (as armas ele pega sozinho em armaNoQG) */
function completaNaBase(P, sq, base) {
  const fac = sq.faccao;
  for (const s of (fac.reserva || []).slice()) {
    if (ativos(sq).length >= 6) break;
    if (s.pedido || ondeEspera(s) !== base || (s.bat || null) !== (sq.bat || null)) continue;
    moveSoldado(P, s, sq); avisa(P, "reforcado", { sq, s });
  }
  // restos pequenos se juntam com outro esquadrão que está no QG
  if (ativos(sq).length < MINIMO_PARA_LUTAR && !sq.manual) {
    const outro = P.esquadroes.find(o => o !== sq && o.faccao === fac && o.bat === sq.bat && !o.combate && ativos(o).length && ativos(o).length < 8 && pertoDeBase(P, fac, o) === base);
    if (outro) { const l = ativos(sq); for (const s of l) moveSoldado(P, s, outro); avisa(P, "juntou", { sq: outro, de: sq, n: l.length }); }
  }
}

/* sem missão: toma prédios sem defesa colados à sua área, perto de onde está */
function pegaFacil(P, sq) {
  if (!sq.posto || sq.estado === "guarnição" && Math.hypot(sq.posto[0] - sq.x, sq.posto[1] - sq.z) > 200) sq.posto = centroDoEsquadrao(sq);
  const fac = sq.faccao, [x, z] = centroDoEsquadrao(sq), lim = postura(sq).pegaFacil;
  let melhor = null, md = lim;
  P.reg.oc.edificiosPerto(x, z, lim, e => {
    if (!podeTomar(P, fac, e) || e.dono && e.dono.governo && TIPOS_CHAVE.includes(e.tipo) || defensores(P, e, fac).length) return;
    if (Math.hypot(e.x - sq.posto[0], e.z - sq.posto[1]) > 160) return;
    let vizinho = false; P.reg.oc.edificiosPerto(e.x, e.z, 30, o => { if (o.dono === fac) vizinho = true; });
    if (!vizinho) return;
    const d = Math.hypot(e.x - x, e.z - z) - (TIPOS_CHAVE.includes(e.tipo) ? 30 : 0);
    if (d < md) { md = d; melhor = e; }
  });
  if (melhor) { ordenaPredio(P, sq, melhor, "ataque"); sq.fixo = false; }
}

/* restrição da missão dada pelo batalhão: só uma zona, ou só prédios de uma facção */
function filtroMissao(sq, e) {
  const m = sq.missao; if (!m) return true;
  if (m.zona && e.zona !== m.zona) return false;
  if (m.contra && e.dono !== m.contra) return false;
  if (m.reservados && m.reservados.has(e)) return false;
  return true;
}
function missaoExpandir(P, sq) {
  const fac = sq.faccao, [x, z] = centroDoEsquadrao(sq);
  const meus = P.reg.edificios.filter(e => e.dono === fac);
  const livre = sq.missao && sq.missao.zona;   // tomar uma zona: vale mesmo longe da sua área
  const pertoDaArea = e => livre || meus.some(m => Math.hypot(m.x - e.x, m.z - e.z) < 260);
  let melhor = null, nota = Infinity;
  for (const zn of P.reg.zonas) for (const e of zn.chaves) {
    if (!podeTomar(P, fac, e) || !daPraTomar(P, sq, e) || !pertoDaArea(e) || !filtroMissao(sq, e)) continue;
    const n = Math.hypot(e.x - x, e.z - z) + forcaDefesa(P, e, fac) * 60 - (zn.chaves.filter(k => k.dono === fac).length / zn.chaves.length) * 200
      - (sq.missao && sq.missao.rotaInimiga && pertoDeRota(P, fac, e.x, e.z, false) ? 180 : 0);   // rua de logística do inimigo: vale mais
    if (n < nota) { nota = n; melhor = e; }
  }
  if (!melhor) for (const e of P.reg.edificios) {   // sem ponto importante possível: prédios comuns perto
    if (!podeTomar(P, fac, e) || defensores(P, e, fac).length || !pertoDaArea(e) || !filtroMissao(sq, e)) continue;
    const d = Math.hypot(e.x - x, e.z - z) - (sq.missao && sq.missao.rotaInimiga && pertoDeRota(P, fac, e.x, e.z, false) ? 120 : 0); if (d < nota) { nota = d; melhor = e; }
  }
  if (melhor) { ordenaPredio(P, sq, melhor, "ataque"); sq.missao.passo = melhor; }
  else if (sq.estado !== "guarnição") ordenaSegurar(P, sq);
}

function missaoDefender(P, sq) {
  const zn = sq.missao.alvo, fac = sq.faccao;
  // inimigo dentro do bairro?
  let alvo = null, md = Infinity; const [x, z] = centroDoEsquadrao(sq);
  for (const o of P.esquadroes) {
    if (!hostis(P, o.faccao, fac) || !ativos(o).length || (o.guarda && !o.combate && o.guarda.zona === zn && o.faccao.governo)) continue;
    const [ox, oz] = centroDoEsquadrao(o);
    if (zonaDe(P.reg, ox, oz) !== zn) continue;
    const d = Math.hypot(ox - x, oz - z); if (d < md) { md = d; alvo = o; }
  }
  if (alvo && forca(sq) >= ativos(alvo).length - 1 + postura(sq).folga) { vaiAtacarEsquadrao(P, sq, alvo, "socorro"); return; }
  // retomar ponto importante do bairro sem defesa
  const perdido = zn.chaves.filter(e => e.dono !== fac && e.donoAnterior === fac && daPraTomar(P, sq, e)).sort((a, b) => Math.hypot(a.x - x, a.z - z) - Math.hypot(b.x - x, b.z - z))[0];
  if (perdido) { ordenaPredio(P, sq, perdido, "ataque"); return; }
  // guarda o ponto importante seu mais valioso do bairro que está sem guarnição
  if (sq.estado === "guarnição" && sq.guarda && sq.guarda.zona === zn) return;
  const meu = zn.chaves.filter(e => e.dono === fac && !guarnicaoDe(P, e).some(o => o !== sq)).sort((a, b) => Math.hypot(a.x - zn.x, a.z - zn.z) - Math.hypot(b.x - zn.x, b.z - zn.z))[0];
  if (meu) ordenaPredio(P, sq, meu, "defesa");
  else { const mm = sq.missao; ordenaPonto(P, sq, zn.x, zn.z, "defesa"); sq.missao = mm; }
}

function missaoCacar(P, sq) {
  const fac = sq.faccao, [x, z] = centroDoEsquadrao(sq), pos = postura(sq);
  let melhor = null, nota = Infinity;
  for (const o of P.esquadroes) {
    if (!hostis(P, o.faccao, fac) || !ativos(o).length) continue;
    if (o.guarda && !o.combate && sq.postura !== "agressivo") continue;   // entrincheirados só para os agressivos
    const [ox, oz] = centroDoEsquadrao(o), d = Math.hypot(ox - x, oz - z);
    if (d > RAIO_CACA || ativos(o).length > forca(sq) + pos.folga) continue;
    const n = d + ativos(o).length * 40 - (o.faccao.governo ? 0 : 150);
    if (n < nota) { nota = n; melhor = o; }
  }
  if (melhor) vaiAtacarEsquadrao(P, sq, melhor, "caca");
  else if (!sq.missao.semAlvoAvisado) { sq.missao.semAlvoAvisado = true; avisa(P, "semalvo", { sq }); }
}

function missaoApoiar(P, sq) {
  const o = sq.missao.alvo;
  if (!o || !ativos(o).length) { daMissao(P, sq, null); avisa(P, "apoiofim", { sq }); return; }
  const [ox, oz] = centroDoEsquadrao(o), [x, z] = centroDoEsquadrao(sq), d = Math.hypot(ox - x, oz - z);
  if (o.combate) { const mm = sq.missao; ordenaPonto(P, sq, ox, oz, "ataque"); sq.missao = mm; return; }
  if (d > 35) { const mm = sq.missao; ordenaPonto(P, sq, ox - 12, oz - 12, "defesa"); sq.missao = mm; }
}

/* quem está perdendo pede ajuda; os vizinhos sem compromisso e quem apoia respondem */
function pedeAjuda(P, sq) {
  if (sq.pediuAjuda) return; sq.pediuAjuda = true;
  avisa(P, "ajuda", { sq });
  const [x, z] = centroDoEsquadrao(sq);
  for (const o of P.esquadroes) {
    if (o === sq || o.faccao !== sq.faccao || o.combate || forca(o) < MINIMO_PARA_LUTAR || o.fixo) continue;
    const apoia = o.missao && o.missao.tipo === "apoiar" && o.missao.alvo === sq;
    const livre = !o.missao || o.missao.tipo === "expandir" || (o.missao.tipo === "defender" && zonaDe(P.reg, x, z) === o.missao.alvo);
    if (!apoia && !(livre && Math.hypot(centroDoEsquadrao(o)[0] - x, centroDoEsquadrao(o)[1] - z) < RAIO_SOCORRO * 1.5)) continue;
    const mm = o.missao; ordenaPonto(P, o, x, z, "ataque"); o.missao = mm;
    avisa(P, "vaiajudar", { sq: o, ajudado: sq });
  }
}

/* chamado a cada segundo: para as facções com missões (jogador e rivais com exército completo) */
function missoesDoSegundo(P) {
  for (const sq of P.esquadroes) {
    if (!completa(sq.faccao) || !ativos(sq).length) continue;
    if (P.tempo < (sq.proximaMissao || 0)) continue;
    sq.proximaMissao = P.tempo + PENSA_MISSAO;
    pensaMissao(P, sq);
  }
}

/* engenheiros fortificam o prédio onde o esquadrão está guardando */
const FORTIFICAR_EM = 2;   // horas do jogo para chegar a 100%
function fortificacoes(P, dt) {
  for (const sq of P.esquadroes) {
    if (sq.estado !== "guarnição" || !sq.guarda || sq.combate) continue;
    const engs = ativos(sq).filter(s => s.funcao === "engenheiro"); if (!engs.length) continue;
    const nv = Math.max(...engs.map(s => (s.item === "explosivo" ? s.nivelItem || 1 : 1))) - 1;   // explosivos melhores, fortificação mais rápida
    const e = sq.guarda, antes = e.fortificado || 0;
    if (e.dono !== sq.faccao) continue;
    e.fortificado = Math.min(1, antes + dt / (NIVEL.fortificaHoras[nv] * HORA));
    if (antes < 1 && e.fortificado >= 1) avisa(P, "fortificado", { sq, e });
  }
}

"use strict";
/* ============================================================
   BASES E PEDIDOS DE TROCA
   Mudar a função (e a arma) de um soldado ou passá-lo para outro
   esquadrão não acontece na hora: vira um pedido. O soldado avisa o
   líder e, assim que sai do combate, o esquadrão vai até a base mais
   perto, faz as trocas e volta à missão.
   - Bases: o QG e as casas de líder de clã que são suas (bases avançadas).
     Todas usam o mesmo arsenal do QG.
   - Transferência: o soldado vai com o esquadrão dele até uma base e fica
     esperando lá; o esquadrão de destino passa para buscar.
   - Nomear líder é na hora (não precisa de base).
   ============================================================ */
function basesDe(P, fac) {
  const l = fac.base ? [fac.base] : [];
  for (const e of P.reg.edificios) if (e.tipo === "lider" && e.dono === fac && e !== fac.base) l.push(e);
  return l;
}
function baseEm(P, fac, x, z) { return basesDe(P, fac).find(b => Math.hypot(b.x - x, b.z - z) < DISTANCIA_PARA_TROCAR) || null; }
function pertoDeBase(P, fac, sq) { const [x, z] = centroDoEsquadrao(sq); return baseEm(P, fac, x, z); }
function baseMaisPerto(P, fac, x, z) {
  let m = null, md = Infinity;
  for (const b of basesDe(P, fac)) { const d = Math.hypot(b.x - x, b.z - z); if (d < md) { md = d; m = b; } }
  return m;
}
const ondeEspera = s => s.esperaEm && s.esperaEm.dono === s.faccao ? s.esperaEm : s.faccao.base;
const nomeBase = (P, b) => b === b.dono.base ? "QG" : "base de " + b.zona.nome;

/* motivo para não poder trocar de função (só o arsenal; o lugar é a base) */
function motivoFuncao(P, s, funcao) {
  const f = FUNCOES[funcao], fac = estoqueDe(s);
  if (s.vida !== "ok" && s.vida !== "reserva") return "fora de combate";
  if (funcao === "lider") return !s.sq ? "precisa estar num esquadrão" : !podeLiderar(s) ? "precisa ser Veterano ou ter liderança " + LIDERANCA_PARA_LIDERAR : null;
  const tem = k => completa(s.faccao) ? !!baseComItem(P, s, k) : noArsenal(fac, k) > 0;
  if (f.arma !== s.arma && !tem(f.arma)) return "sem " + ARMAS[f.arma].n.toLowerCase() + " em nenhuma base";
  if (f.item && f.item !== s.item && !tem(f.item)) return "sem " + ITENS[f.item].toLowerCase() + " em nenhuma base";
  return null;
}

/* ---------- pedidos ---------- */
function pedeFuncao(P, s, funcao) {
  if (motivoFuncao(P, s, funcao)) return false;
  if (funcao === "lider") { trocaFuncao(P, s, "lider"); return true; }
  if (s.funcao === funcao && !(s.pedido && s.pedido.tipo === "funcao")) return false;
  s.pedido = s.funcao === funcao ? null : { tipo: "funcao", funcao };
  if (s.vida === "reserva" && s.pedido) { trocaFuncao(P, s, funcao); s.pedido = null; avisa(P, "trocou", { s, funcao, base: ondeEspera(s) }); return true; }
  if (s.pedido) avisa(P, "pedidotroca", { s, funcao });
  return true;
}
/* esquadrão novo precisa de líder: ou ele pode comandar, ou alguém do mesmo grupo que pode já pediu para ir ao novo */
function podeIrParaNovo(P, s) {
  if (podeLiderar(s)) return true;
  const grupo = s.sq ? ativos(s.sq) : s.faccao.reserva.filter(o => ondeEspera(o) === ondeEspera(s));
  return grupo.some(o => o !== s && o.pedido && o.pedido.destino === "novo" && podeLiderar(o));
}
function pedeTransferencia(P, s, destino) {
  if (destino === s.sq) { s.pedido = null; return false; }
  if (destino === "novo" && !podeIrParaNovo(P, s)) return false;
  s.pedido = { tipo: "transferir", destino };
  if (s.vida === "reserva" && destino === "novo") {   // já está na base: forma o esquadrão ali
    const base = ondeEspera(s); s.pedido = null;
    const sq = moveSoldado(P, s, "novo"); sq.x = base.x; sq.z = base.z; sq.manual = true; posicionaNoLugar(P, sq);
    return true;
  }
  avisa(P, "pedidotransfer", { s, destino });
  return true;
}
function cancelaPedido(s) { s.pedido = null; }

/* quem tem pedido no esquadrão, e quem está esperando numa base para entrar nele */
function pendencias(P, sq) {
  const proprios = ativos(sq).filter(s => s.pedido);
  const buscar = (sq.faccao.reserva || []).filter(s => s.pedido && s.pedido.destino === sq);
  return { proprios, buscar };
}

/* chamado na decisão do esquadrão (jogador). Devolve true se está cuidando de trocas. */
function logistica(P, sq) {
  if (!ativos(sq).length || sq.combate) return false;
  const fac = sq.faccao, { proprios, buscar } = pendencias(P, sq);
  if (!proprios.length && !buscar.length) { sq.indoABase = null; return false; }
  const aqui = pertoDeBase(P, fac, sq);
  if (aqui) {
    aplicaNaBase(P, sq, aqui);
    const resto = pendencias(P, sq);
    if (!resto.proprios.length && !resto.buscar.length) { sq.indoABase = null; return false; }
  }
  // para onde ir: com pedidos próprios, a base mais perto; só para buscar, onde o soldado espera
  const [x, z] = centroDoEsquadrao(sq);
  let alvo;
  const r = pendencias(P, sq);
  if (r.proprios.length) {
    // troca de função: vai à base que tem a arma ou o kit; o resto, à base mais perto
    const pf = r.proprios.find(s => s.pedido && s.pedido.tipo === "funcao");
    const f = pf && FUNCOES[pf.pedido.funcao], precisa = f && (f.arma !== pf.arma ? f.arma : f.item && f.item !== pf.item ? f.item : null);
    alvo = (precisa && baseComItem(P, pf, precisa)) || baseMaisPerto(P, fac, x, z);
  }
  else alvo = r.buscar.map(ondeEspera).sort((a, b) => Math.hypot(a.x - x, a.z - z) - Math.hypot(b.x - x, b.z - z))[0];

  if (sq.estado === "andando" && sq.indoABase === alvo) return true;
  const mm = sq.missao; ordenaPredio(P, sq, alvo, "defesa"); sq.missao = mm;
  if (sq.indoABase !== alvo) avisa(P, "vaibase", { sq, base: alvo });
  sq.indoABase = alvo;
  return true;
}

function aplicaNaBase(P, sq, base) {
  const fac = sq.faccao, novos = [];
  for (const s of ativos(sq).filter(s => s.pedido)) {
    const p = s.pedido;
    if (p.tipo === "funcao") {
      const m = motivoFuncao(P, s, p.funcao); s.pedido = null;
      if (m) avisa(P, "semtroca", { s, motivo: m });
      else { trocaFuncao(P, s, p.funcao); anota(P, s, "Virou " + FUNCOES[p.funcao].n.toLowerCase() + " na " + nomeBase(P, base)); avisa(P, "trocou", { s, funcao: p.funcao, base }); }
    } else if (p.tipo === "comandar") {
      s.pedido = null;
      if (batalhoesDe(P, fac).length < limiteBatalhoes(P, fac) && podeLiderar(s)) criaBatalhao(P, fac, s, base);
      continue;
    } else if (p.tipo === "transferir") {
      if (p.destino === "novo") { novos.push(s); continue; }
      if (p.destino === "bat") {   // muda de batalhão: fica na base esperando o novo batalhão
        s.pedido = null; sq.membros = sq.membros.filter(m => m !== s); s.sqAntes = sq; s.sq = null;
        s.vida = "reserva"; s.esperaEm = base; s.x = base.x; s.z = base.z; s.bat = p.bat; fac.reserva.push(s);
        if (sq.lider === s) escolheLider(P, sq);
        avisa(P, "mudoubatalhao", { s, b: p.bat });
        continue;
      }
      if (!p.destino.membros || !ativos(p.destino).length && p.destino.membros.every(m => m.vida === "morto")) { s.pedido = null; continue; }
      if (pertoDeBase(P, fac, p.destino) === base && !p.destino.combate) { s.pedido = null; moveSoldado(P, s, p.destino); avisa(P, "transferido", { s, sq: p.destino }); continue; }
      // fica esperando na base
      sq.membros = sq.membros.filter(m => m !== s); s.sqAntes = sq; s.sq = null;
      s.vida = "reserva"; s.esperaEm = base; s.x = base.x; s.z = base.z; fac.reserva.push(s);
      if (sq.lider === s) escolheLider(P, sq);
      anota(P, s, "Ficou na " + nomeBase(P, base) + " esperando " + p.destino.nome);
      avisa(P, "esperando", { s, sq: p.destino, base });
    }
  }
  if (novos.length) {
    novos.forEach(s => s.pedido = null);
    const chefe = novos.filter(podeLiderar).sort((a, b) => b.atr.lideranca - a.atr.lideranca)[0];
    if (!chefe) { avisa(P, "semlider", { sq }); return; }   // sem quem comande, ninguém sai
    const dest = moveSoldado(P, chefe, "novo");
    for (const s of novos) if (s !== chefe) moveSoldado(P, s, dest);
    dest.lider = chefe; anota(P, chefe, "Assumiu o comando de " + dest.nome);
    dest.x = base.x; dest.z = base.z; dest.manual = true; posicionaNoLugar(P, dest);
    avisa(P, "novoesquadrao", { sq: dest, base, de: sq });
  }
  // buscar quem espera aqui
  for (const s of (fac.reserva || []).slice()) {
    if (!s.pedido || s.pedido.destino !== sq || ondeEspera(s) !== base) continue;
    s.pedido = null; moveSoldado(P, s, sq);
    anota(P, s, "Entrou em " + sq.nome + " na " + nomeBase(P, base));
    avisa(P, "transferido", { s, sq });
  }
}

"use strict";
/* ============================================================
   DIPLOMACIA
   - Todas as facções começam neutras entre si; o governo antigo está
     em guerra com todas.
   - Estados: neutro, pacto (não agressão), aliança, guerra.
     Só quem está em guerra luta e toma prédios um do outro.
     Neutros não se atacam (atacar um neutro é declarar guerra).
     Aliados também se ajudam nas lutas e trocam armas.
   - A relação (−100 a 100) muda com: fronteira e ataques, inimigo em
     comum, presentes e medo de quem cresce demais.

"use strict";

   - Orçamento: o jogador entrega soldados e uma parte do arsenal

     facção; dali o jogador passa para cada batalhão.

   - Começa com 1 batalhão; abre mais conforme o território cresce.

  tomar:    { n: "Tomar área", icone: "flag", pede: "zona", dica: "Toma os pontos importantes e os prédios da zona escolhida" },
  proteger: { n: "Proteger área", icone: "shield_home", pede: "zona", dica: "Guarda a zona escolhida e expulsa quem entrar" },
  frente:   { n: "Segurar frente", icone: "wall", pede: "faccao", dica: "Ocupa a fronteira com a facção escolhida e segura quem vier" },
  avancar:  { n: "Avançar fronteira", icone: "swords", pede: "faccao", dica: "Toma os prédios da facção escolhida, a partir da fronteira (precisa estar em guerra)" }

/* ---------- o líder pensa (a cada 5 s) ---------- */
/* ---------- estoque mínimo: o batalhão se repõe sozinho do depósito geral e recruta até o mínimo de soldados ---------- */
const REPOSICAO = { recrutaACada: 5 };   // minutos do jogo entre um recruta e outro, por batalhão

function estoqueDoBatalhao(b, k) { return ehCaixa(k) ? b.municao[tipoDaCaixa(k)] : noArsenal(b, k); }

/* composição ideal: 1 sargento, 1 AR, 1 médico; AT, granadeiro e engenheiro se houver equipamento */

function mesmaMissao(a, b) { return a && b && a.tipo === b.tipo && a.zona === b.zona && a.contra === b.contra && a.alvo === b.alvo; }

/* ---------- sugestões do jogador (o líder decide) ---------- */

  } else if (pedido.destino && pedido.destino !== "novo" && pedido.destino.bat !== b) motivo = "esse esquadrão é de outro batalhão";

/* ============================================================
   ESTOQUES POR BASE (jogador e rivais com exército completo)
   Três tipos de base:
   - QG da facção: o depósito geral. Compras, fábricas e doações chegam aqui.
   - Base do líder: onde está o líder de um batalhão. O estoque do
     batalhão (com mínimo) fica aqui. Os veículos trazem do QG.
   - Base avançada: as outras casas de líder de clã. Cada uma tem o seu
     estoque; o líder do batalhão manda munição para as bases perto de
     onde os esquadrões dele lutam.
   O esquadrão só usa o estoque da base onde está.
   ============================================================ */
const COMPRA_AUTO = { filaMaxHoras: 3 };   // fabrica só se a fila da oficina tiver menos de 3 h de trabalho; senão compra

function criaEstoque() { return { arsenal: criaArsenal(), municao: { bala: 0, cinta: 0, granada: 0, foguete: 0 } }; }

function estoquesNaBase(P, fac, bat, base) {
  if (!completa(fac)) return [fac];
  if (!base) return [];
  const l = [];
  if (bat && !bat.dissolvido && bat.base === base) l.push(bat);
  l.push(base === fac.base ? fac : estoqueDaBase(base));
  return l;
}
/* o estoque "da base" (onde se descarrega): QG = depósito, base do líder = estoque do batalhão */
function estoqueDoLugar(P, fac, base, bat) {
  if (!completa(fac) || base === fac.base) return fac;
  const b = bat && bat.base === base ? bat : batalhoesDe(P, fac).find(o => o.base === base);
  return b || estoqueDaBase(base);
}
function tipoDaBase(P, fac, e) { return e === fac.base ? "qg" : batalhoesDe(P, fac).some(b => b.base === e) ? "lider" : "avancada"; }
const NOME_TIPO_BASE = { qg: "QG", lider: "Base do líder", avancada: "Base avançada" };
function baseDoSoldado(P, s) { return s.sq ? pertoDeBase(P, s.faccao, s.sq) : s.vida === "reserva" ? ondeEspera(s) : baseEm(P, s.faccao, s.x, s.z); }

function melhorEm(l, b) { for (const n of [3, 2, 1]) for (const e of l) if ((e.arsenal[chave(b, n)] || 0) > 0) return { e, n }; return null; }

const somaMunicao = (l, t) => l.reduce((x, e) => x + (e.municao ? e.municao[t] || 0 : 0), 0);

/* numa base: pega a melhor arma da função, o melhor kit e enche a munição (do estoque daquela base) */
function equipaNaBase(P, s, base) {
  const l = completa(s.faccao) ? estoquesNaBase(P, s.faccao, s.bat, base || baseDoSoldado(P, s)) : [s.faccao];

  if (m && (s.arma !== f.arma || m.n > (s.nivel || 1))) {
    if (s.arma !== f.arma) devolveArma(dep, s); else dep.arsenal[chave(s.arma, s.nivel || 1)] = (dep.arsenal[chave(s.arma, s.nivel || 1)] || 0) + 1;

  let m = null, md = Infinity;

/* ---------- compra automática do mínimo (fabrica se der, senão mercado negro; chega no QG) ---------- */
function filaDeFabrica(P, fac) { const p = pontosDeFabrica(P, fac).leve; return p ? fac.producao.reduce((t, o) => t + pontosDoItem(o.item) - o.feito, 0) / p : Infinity; }

    if (!podeFabricar(P, fac, item) && filaDeFabrica(P, fac) < COMPRA_AUTO.filaMaxHoras) { fabrica(P, fac, item); fac.producao[fac.producao.length - 1].para = b; feitos++; continue; }

"use strict";
/* ============================================================
   VEÍCULOS DE LOGÍSTICA
   Levam armas, kits e munição entre as bases. Nível I, II e III:
   quanto maior, mais carga e mais vida. Cada um é pilotado por um
   soldado do batalhão a que está atribuído; o líder decide as viagens:
   1) do QG para a base do líder (o que falta para o mínimo do batalhão);
   2) da base do líder para as bases avançadas perto dos esquadrões.
   No caminho podem ser atacados: destruído, a carga fica com quem
   destruiu; com o motorista morto, quem chegar perto leva o veículo.
   As rivais também mandam comboios do QG para a frente delas.
   (Números provisórios.)
   ============================================================ */
const VEICULOS = [
  { n: "Picape", carga: 12, vida: 120, vel: 9 },
  { n: "Caminhão", carga: 26, vida: 260, vel: 8 },
  { n: "Caminhão blindado", carga: 45, vida: 520, vel: 7 }

const ESPACO = { metralhadora: 2, lancagranadas: 2, rpg: 2 };   // o resto ocupa 1; cada caixa de munição ocupa 1
const LOGISTICA = {
  pensa: 3, alcanceTiro: 170, acerto: .35, dano: { fuzil: 6, metralhadora: 9, lancagranadas: 30, rpg: 90 },
  motorista: .04, motoristaRpg: .25, capturaPerto: 40, avancadaRaio: 700, guardaRota: 6 * HORA,
  rival: { aCada: [3, 6], alcance: 1200 }
};
let ultimoVeiculo = 0;
const capacidade = v => VEICULOS[v.nivel - 1].carga;
const espacoDe = k => ESPACO[baseDe(k)] || 1;
function volumeCarga(c) {
  let v = 0;
  for (const [k, n] of Object.entries(c.arsenal)) v += (n || 0) * espacoDe(k);
  for (const t of Object.keys(c.municao)) v += Math.ceil(c.municao[t] / MUNICOES[t].caixa);

    const forte = minha >= forcaDe(outra) * d.ataque;
    ordens.push({ tipo: forte ? "avancar" : "frente", alvo: outra, peso: forte ? 2 : 2 + contato / 20 });
  }
  // 3) expansão: a zona mais vantajosa perto da sua área
  const zona = melhorZona(P, fac, d, meus, minha);
  if (zona) ordens.push({ tipo: "tomar", alvo: zona, peso: 1.5 });
  ordens.sort((a, b) => b.peso - a.peso);
  // divide entre os batalhões: o 1º (perto do QG) fica com a defesa; os outros com o que estiver mais perto da base deles
  const porBat = new Map(bats.map(b => [b, []]));
  const lugar = o => o.alvo.chaves ? [o.alvo.x, o.alvo.z] : o.alvo.base ? [o.alvo.base.x, o.alvo.base.z] : [fac.base.x, fac.base.z];
  for (const o of ordens.slice(0, d.ordens * bats.length)) {
    let b;
    if (o.tipo === "proteger" || bats.length === 1) b = bats[0];
    else { const [x, z] = lugar(o); b = bats.filter(k => porBat.get(k).length < d.ordens).sort((a, k) => (porBat.get(a).length - porBat.get(k).length) || Math.hypot(a.base.x - x, a.base.z - z) - Math.hypot(k.base.x - x, k.base.z - z))[0]; }

/* troca as ordens do batalhão sem desmanchar as que continuam iguais (o líder não reembaralha os esquadrões à toa) */
function poeOrdens(P, b, l) {

  const novas = l.map(o => antes.find(a => a.tipo === o.tipo && a.alvo === o.alvo) || { tipo: o.tipo, alvo: o.alvo, desde: P.tempo, id: (b.nOrdem = (b.nOrdem || 0) + 1) });
  const mudou = novas.length !== antes.length || novas.some((o, i) => o !== antes[i]);
