function melhorZona(P, fac, d, meus, minha) {
  let melhor = null, nota = Infinity;
  for (const zn of P.reg.zonas) {
    if (zn.dono === fac || !zn.chaves.length) continue;
    const toma = zn.chaves.filter(e => podeTomar(P, fac, e));
    if (!toma.length) continue;
    let dist = Infinity; for (const e of meus) dist = Math.min(dist, Math.hypot(e.x - zn.x, e.z - zn.z));
    if (dist > 1200) continue;
    const defesa = toma.reduce((n, e) => n + forcaDefesa(P, e, fac), 0) / toma.length;   // defesa média de um ponto
    if (defesa * d.ataque > Math.max(minha, 3)) continue;   // nem o ponto médio dá para tomar
    const ja = zn.chaves.filter(e => e.dono === fac).length / zn.chaves.length;
    const n = dist + defesa * 60 - ja * 400 + (zn.tipo === "velha" ? 300 : 0);
    if (n < nota) { nota = n; melhor = zn; }
  }
  return melhor;
}

"use strict";
/* ============================================================
   ORDENS DO JOGADOR
   - Avançar até um ponto (ou prédio): no caminho o esquadrão toma as
     casas por onde passa e desvia para pegar os pontos importantes perto.
   - Defender um ponto: vai até lá e ocupa o prédio mais perto.
   - Tomar uma zona: vai pegando os pontos importantes dela, um a um.
   - Linha de ataque ou de defesa: vários esquadrões espalhados ao longo
     de uma linha desenhada no mapa.
   ============================================================ */
const RAIO_VARREDURA = 12;   // casas a menos disso do esquadrão passam para ele
const RAIO_DESVIO = 150;     // pontos importantes a menos disso puxam um desvio
const CORREDOR = 110;        // ... desde que fiquem perto do caminho até o destino

function objetivoDe(sq) {
  if (sq.alvo) return entradaDe(sq.alvo);
  if (sq.ordem.alvo) return entradaDe(sq.ordem.alvo);
  if (sq.ordem.destino) return sq.ordem.destino;
  return null;
}
function rotaAtePonto(P, sq, x, z) {
  let [ax, az] = centroDoEsquadrao(sq);
  if (sq.guarda && !sq.combate) [ax, az] = entradaDe(sq.guarda);
  sq.rota = rotaAPe(P.reg, ax, az, x, z, evitaPara(P, sq));
  sq.x = sq.rota[0][0]; sq.z = sq.rota[0][1];
  sq.passo = 1; sq.alvo = null; sq.guarda = null; sq.estado = "andando";
  for (const s of sq.membros) s.dentro = null;
}
function ordenaPonto(P, sq, x, z, modo) {
  sq.ordem = { tipo: modo === "defesa" ? "defender" : "avancar", destino: [x, z], visitados: new Set() };
  sq.sub = null;
  if (!sq.combate) rotaAtePonto(P, sq, x, z);
  avisa(P, "ordem", { sq });
}
function ordenaPredio(P, sq, e, modo) {
  if (modo === "defesa") { ordenaPonto(P, sq, e.x, e.z, "defesa"); sq.ordem.alvo = e; if (!sq.combate) rotaAte(P, sq, e); return; }
  sq.ordem = { tipo: "avancar", alvo: e, destino: entradaDe(e), visitados: new Set() };
  sq.sub = null;
  if (!sq.combate) rotaAte(P, sq, e);
  avisa(P, "ordem", { sq, e });
}
function ordenaZona(P, sq, zn) {
  sq.ordem = { tipo: "zona", zona: zn, visitados: new Set() }; sq.sub = null;
  if (!sq.combate) continuaOrdem(P, sq);
  avisa(P, "ordem", { sq });
}
function ordenaRecuar(P, sq) {
  const b = sq.faccao.base;
  if (b) ordenaPredio(P, sq, b, "defesa"); else ordenaSegurar(P, sq);
}
/* Vários esquadrões espalhados ao longo de uma linha, na ordem em que estão no mapa */
function ordenaLinha(P, lista, ax, az, bx, bz, modo) {
  const dx = bx - ax, dz = bz - az, L2 = dx * dx + dz * dz || 1;
  const ord = lista.slice().sort((p, q) => {
    const [px, pz] = centroDoEsquadrao(p), [qx, qz] = centroDoEsquadrao(q);
    return ((px - ax) * dx + (pz - az) * dz) / L2 - ((qx - ax) * dx + (qz - az) * dz) / L2;
  });
  ord.forEach((sq, i) => { const t = (i + .5) / ord.length; ordenaPonto(P, sq, ax + dx * t, az + dz * t, modo); });
}

/* Depois de tomar algo no caminho ou de um combate, segue a ordem */
function continuaOrdem(P, sq) {
  const o = sq.ordem;
  if (o.tipo === "zona") {
    const minhas = e => e.dono === sq.faccao;
    const [x, z] = centroDoEsquadrao(sq);
    const pend = o.zona.chaves.filter(e => !minhas(e)).sort((a, b) => {
      const da = Math.hypot(a.x - x, a.z - z) + (defensores(P, a, sq.faccao).length ? 400 : 0);
      const db = Math.hypot(b.x - x, b.z - z) + (defensores(P, b, sq.faccao).length ? 400 : 0);
      return da - db;
    });
    if (pend.length) { sq.sub = pend[0]; rotaAte(P, sq, pend[0]); return; }
    const fim = o.zona.chaves.filter(minhas).sort((a, b) => Math.hypot(a.x - x, a.z - z) - Math.hypot(b.x - x, b.z - z))[0];
    if (fim && !guarnicaoDe(P, fim).length) { sq.ordem = { tipo: "segurar" }; rotaAte(P, sq, fim); }
    else ordenaSegurar(P, sq);
    avisa(P, "zonaconcluida", { sq, zona: o.zona });
    return;
  }
  if (o.alvo && o.alvo.dono !== sq.faccao) { rotaAte(P, sq, o.alvo); return; }
  if (o.destino) { rotaAtePonto(P, sq, o.destino[0], o.destino[1]); return; }
  ordenaSegurar(P, sq);
}

/* Chegou ao ponto da ordem: ocupa o prédio mais adequado por perto */
function chegouAoPonto(P, sq) {
  const [x, z] = sq.ordem.destino || [sq.x, sq.z];
  let melhor = null, mn = Infinity;
  for (const e of P.reg.edificios) {
    const d = Math.hypot(e.x - x, e.z - z); if (d > 50) continue;
    if (guarnicaoDe(P, e).some(o => o !== sq)) continue;
    const nota = d - (e.dono === sq.faccao ? 15 : 0) - (TIPOS_CHAVE.includes(e.tipo) ? 10 : 0);
    if (nota < mn) { mn = nota; melhor = e; }
  }
  if (melhor) { sq.ordem = { tipo: "segurar" }; ocupa(P, sq, melhor); }
  else { sq.ordem = { tipo: "segurar" }; sq.estado = "parado"; sq.rota = null; avisa(P, "chegou", { sq }); }
}

/* No caminho: toma as casas por onde passa e desvia para os pontos importantes */
function varredura(P) {
  for (const sq of P.esquadroes) {
    if (sq.combate || sq.estado !== "andando" || !ativos(sq).length) continue;
    const o = sq.ordem; if (o.tipo !== "avancar" && o.tipo !== "zona") continue;
    const [x, z] = centroDoEsquadrao(sq);
    P.reg.oc.edificiosPerto(x, z, RAIO_VARREDURA, e => {
      if (!podeTomar(P, sq.faccao, e) || TIPOS_CHAVE.includes(e.tipo) || defensores(P, e, sq.faccao).length) return;
      tomaEdificio(P, e, sq.faccao);
    });
    if (o.tipo !== "avancar" || sq.sub || !o.destino) continue;
    const [dx, dz] = o.destino, falta = Math.hypot(dx - x, dz - z);
    let melhor = null, md = completa(sq.faccao) ? postura(sq).desvio : RAIO_DESVIO;
    for (const zn of P.reg.zonas) {
      if (Math.hypot(zn.x - x, zn.z - z) > 700) continue;
      for (const e of zn.chaves) {
        if (!podeTomar(P, sq.faccao, e) || o.visitados.has(e) || e === o.alvo || defensores(P, e, sq.faccao).length) continue;
        const d = Math.hypot(e.x - x, e.z - z);
        if (d > md || Math.hypot(e.x - dx, e.z - dz) > falta + 60) continue;
        if (distPontoSeg(e.x, e.z, x, z, dx, dz).d > CORREDOR) continue;
        md = d; melhor = e;
      }
    }
    if (melhor) { sq.sub = melhor; rotaAte(P, sq, melhor); avisa(P, "desvio", { sq, e: melhor }); }
  }
}

"use strict";
/* ============================================================
   RETRATOS E ÍCONES DESENHADOS
   - Cada soldado tem um rosto desenhado a partir de s.rosto (pele,
     barba, lenço, capacete...). O lenço ou a bandana pode ter a cor
     da facção, e o fundo do retrato sempre tem.
   - As armas têm silhuetas próprias (a fonte de ícones não tem armas).
   ============================================================ */
const PELES = ["#e3b892", "#cf9f73", "#b8865b", "#9e6c45", "#80553a", "#d9a87b"];
const CABELOS = ["#1c1612", "#2e2118", "#4a3424", "#131313"];
const PANOS = [["#f1efe8", "#b8352f"], ["#f1efe8", "#22201d"], ["#5b6640", "#3d4530"], ["#2d3440", "#1d222a"], ["#7a5c3a", "#4d3a24"]];
const ROUPAS = ["#4c5a3a", "#5a4a3a", "#3a4552", "#6b5b45", "#444a3c"];
const cacheRetrato = new Map();

function clareia(hex, f) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const m = c => Math.round(c + (255 - c) * f);
  return "#" + ((m(r) << 16) | (m(g) << 8) | m(b)).toString(16).padStart(6, "0");
}
function escurece(hex, f) {
  const n = parseInt(hex.slice(1), 16), m = c => Math.round(c * (1 - f));
  return "#" + ((m(n >> 16) << 16) | (m(n >> 8 & 255) << 8) | m(n & 255)).toString(16).padStart(6, "0");
}

/* desenho do rosto num quadrado 64×64 */
function svgRetrato(s, tam) {

  const corFac = corCss(s.faccao.cor), pele = PELES[R.pele], cab = R.grisalho ? "#9d978c" : CABELOS[R.cabelo];
  const gov = s.faccao.governo, roupa = gov ? "#55603f" : ROUPAS[(s.id * 7) % ROUPAS.length];
  let pano = PANOS[R.pano];
  if (R.corDaFaccao) pano = [corFac, escurece(corFac, .35)];

  h += `<circle cx="32" cy="32" r="31" fill="${clareia(corFac, .55)}"/><g clip-path="url(#c${s.id}_${tam})">`;
  // ombros e roupa (com a faixa da facção no ombro)
  h += `<path d="M6 66 Q8 47 32 46 Q56 47 58 66Z" fill="${roupa}"/>`;
  h += `<path d="M10 56 Q14 50 21 48 L23 54 Q16 55 12 60Z" fill="${corFac}"/>`;
  if (s.funcao === "medico") h += `<rect x="38" y="52" width="9" height="9" rx="1.5" fill="#fff"/><path d="M42.5 53.5v6M39.5 56.5h6" stroke="#d33" stroke-width="2"/>`;

  // barba e bigode
  if (R.barba === 2) h += `<path d="M${33 - rx} 30 Q${34 - rx} 46 32 47 Q${30 + rx} 46 ${31 + rx} 30 Q${27 + rx} 38 32 38.5 Q${37 - rx} 38 ${33 - rx} 30Z" fill="${cab}"/>`;
  else if (R.barba === 1) h += `<path d="M${34 - rx} 33 Q${35 - rx} 43 32 44 Q${29 + rx} 43 ${30 + rx} 33 Q${27 + rx} 39 32 39.5 Q${37 - rx} 39 ${34 - rx} 33Z" fill="${cab}" opacity=".85"/>`;
  if (R.bigode || R.barba) h += `<path d="M26.5 35.5 Q32 33 37.5 35.5 Q32 34.8 26.5 35.5Z" fill="${cab}" stroke="${cab}" stroke-width="1.6" stroke-linejoin="round"/>`;

  h += `<path d="M32 28 L30.6 33.2 Q32 34 33.6 33.2" stroke="${escurece(pele, .3)}" stroke-width="1.1" fill="none" stroke-linejoin="round"/>`;
  h += `<ellipse cx="${26.3 + ox}" cy="27.5" rx="2" ry="1.7" fill="#fff"/><ellipse cx="${37.7 - ox}" cy="27.5" rx="2" ry="1.7" fill="#fff"/>`;
  h += `<circle cx="${26.6 + ox}" cy="27.6" r="1.3" fill="#2a1d14"/><circle cx="${37.4 - ox}" cy="27.6" r="1.3" fill="#2a1d14"/>`;

  // o que leva na cabeça
  if (R.cabeca === "keffiyeh") {
    h += `<path d="M${30 - rx} 34 Q${29 - rx} 8 32 8 Q${35 + rx} 8 ${34 + rx} 34 L${36 + rx} 52 Q${30 + rx} 44 ${31 + rx} 30 Q${30 + rx} 15 32 15 Q${34 - rx} 15 ${33 - rx} 30 Q${34 - rx} 44 ${28 - rx} 52Z" fill="${pano[0]}"/>`;
    h += `<path d="M${33 - rx} 18 H${31 + rx}M${32 - rx} 13.5 H${32 + rx}" stroke="${pano[1]}" stroke-width="1.6" stroke-dasharray="2.2 1.6"/>`;
    h += `<path d="M${33 - rx} 16 Q32 13 ${31 + rx} 16" stroke="#1d1a17" stroke-width="2.4" fill="none"/>`;
  } else if (R.cabeca === "bandana") {
    h += `<path d="M${32 - rx} 24 Q${32 - rx} 11 32 11 Q${32 + rx} 11 ${32 + rx} 24 Q32 19.5 ${32 - rx} 24Z" fill="${pano[0]}"/>`;
    h += `<path d="M${32 + rx - 1} 21 l7 4 l-2 4Z" fill="${pano[1]}"/>`;
  } else if (R.cabeca === "gorro") {
    const g = R.corDaFaccao ? corFac : ["#2b2b2b", "#5a1f24", "#26324a", "#4a3d2a", "#3a3a3a"][R.pano];
    h += `<path d="M${31 - rx} 24 Q${30 - rx} 9 32 6 Q${34 + rx} 9 ${33 + rx} 24Z" fill="${g}"/><circle cx="32" cy="6.5" r="2.6" fill="${escurece(g, .2)}"/>`;
    h += `<rect x="${31 - rx}" y="19" width="${2 * rx + 2}" height="6" rx="2.5" fill="${escurece(g, .22)}"/>`;
    h += `<path d="M${33 - rx} 19.5v5M${36 - rx} 19.5v5M${39 - rx} 19.5v5M${25 + rx} 19.5v5M${28 + rx} 19.5v5M${31 + rx} 19.5v5" stroke="${escurece(g, .4)}" stroke-width=".8"/>`;
  } else if (R.cabeca === "capacete") {

    h += `<path d="M${33 - rx} 25 V33M${31 + rx} 25 V33" stroke="${escurece(c, .4)}" stroke-width="1.2"/>`;

    h += `<path d="M${32 - rx} 21 Q${32 - rx} 9 32 9 Q${32 + rx} 9 ${32 + rx} 21Z" fill="${c}"/><path d="M${30 - rx} 21 H${38 + rx} Q${38 + rx} 24 ${34 + rx} 24 H${31 - rx}Z" fill="${escurece(c, .25)}"/>`;
  }
  h += `</g>`;
  if (s.vida === "morto") h += `<circle cx="32" cy="32" r="31" fill="#000" opacity=".55"/>`;
  else if (s.vida === "rendido") h += `<circle cx="32" cy="32" r="31" fill="#000" opacity=".35"/>`;
  h += `<circle cx="32" cy="32" r="30.5" fill="none" stroke="${corFac}" stroke-width="2.5"/></svg>`;

/* ============================================================

   O relevo é uma malha de 8 em 8 m. As cores (chão, campos, rio, ruas)

function pintaTerreno(reg, T) {
  const cv = document.createElement("canvas"); cv.width = cv.height = T;
  const ctx = cv.getContext("2d");
  const s = T / MUNDO, X = x => (x + METADE) * s, Z = z => (z + METADE) * s;

    const x = -METADE + (i + .5) * MUNDO / B, z = -METADE + (j + .5) * MUNDO / B;
    const h = alturaEm(reg, x, z), g = declive(reg, x, z), dr = distRio(reg, x, z);
    const n = fbm(nd, x / 60, z / 60, 3), n2 = nd(x / 420 + 50, z / 420 - 20);

    mix(c, [152, 128, 98], suave(.16, .5, g.m) * .85);

    const k = 1 + n * .13, o = (j * B + i) * 4;
    px[o] = c[0] * k; px[o + 1] = c[1] * k; px[o + 2] = c[2] * k; px[o + 3] = 255;
  }

  // pedrinhas e moitas secas

  ctx.fillStyle = "rgba(105,90,66,.28)";
  for (let i = 0; i < 60000; i++) { const x = r.entre(-METADE, METADE), z = r.entre(-METADE, METADE), t = r.entre(.6, 1.8) * s; ctx.fillRect(X(x), Z(z), t, t); }
  ctx.fillStyle = "rgba(235,222,190,.25)";
  for (let i = 0; i < 30000; i++) { const x = r.entre(-METADE, METADE), z = r.entre(-METADE, METADE), t = r.entre(.6, 1.6) * s; ctx.fillRect(X(x), Z(z), t, t); }

    ctx.restore();

    ctx.fillStyle = "#c2b79e"; retangulo(o, 0);
    ctx.save(); ctx.translate(X(o.x), Z(o.z)); ctx.rotate(o.a); ctx.fillStyle = "#e2ddd0";

    beco:    { borda: null, borda2: 0, chao: "#9b8b74" },
    rua:     { borda: "#c4bba8", borda2: 3, chao: "#6d6a62" },
    estrada: { borda: "#b8a782", borda2: 2.5, chao: "#64615a" },
    avenida: { borda: "#cac1ad", borda2: 4.5, chao: "#5e5b55", meio: "#8f9a6a" },

/* ============================================================
   CAMADA DE TERRITÓRIO SOBRE O MAPA
   - Zona com controle total: chão e borda na cor do dono.
   - Sem controle total: só a marca de cada prédio na cor de quem o controla.
   - Bordas finas brancas mostram os limites de todas as zonas.
   ============================================================ */
function criaCamadaTerritorio(reg, geoTerreno) {
  const R = 1024, ids = new Int16Array(R * R), borda = new Uint8Array(R * R);
  const valida = new Set(reg.zonas);
  for (let j = 0; j < R; j++) for (let i = 0; i < R; i++) {
    const x = -METADE + (i + .5) * MUNDO / R, z = -METADE + (j + .5) * MUNDO / R, zn = zonaDe(reg, x, z);
    ids[j * R + i] = zn && valida.has(zn) ? zn.id : -1;
  }
  for (let j = 1; j < R - 1; j++) for (let i = 1; i < R - 1; i++) {
    const k = j * R + i, v = ids[k];
    if (ids[k + 1] !== v || ids[k - 1] !== v || ids[k + R] !== v || ids[k - R] !== v) borda[k] = 1;
  }
  const base = document.createElement("canvas"); base.width = base.height = R;
  const bctx = base.getContext("2d"), img = bctx.createImageData(R, R);
  const T = 2048, cv = document.createElement("canvas"); cv.width = cv.height = T;
  const ctx = cv.getContext("2d"), tex = new THREE.CanvasTexture(cv);
  const malha = new THREE.Mesh(geoTerreno, new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4 }));
  malha.renderOrder = 1;
  const camada = { malha, tex, cv, sujo: true };
  camada.atualiza = () => {
    const cores = reg.zonas.map(zn => zn.dono ? [(zn.dono.cor >> 16) & 255, (zn.dono.cor >> 8) & 255, zn.dono.cor & 255] : null);
    const d = img.data;
    for (let k = 0; k < R * R; k++) {
      const id = ids[k], o = k * 4, c = id >= 0 ? cores[id] : null;
      if (borda[k]) { if (c) { d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 235; } else { d[o] = d[o + 1] = d[o + 2] = 255; d[o + 3] = 70; } }
      else if (c) { d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 62; }
      else d[o + 3] = 0;
    }
    bctx.putImageData(img, 0, 0);
    ctx.clearRect(0, 0, T, T); ctx.imageSmoothingEnabled = true; ctx.drawImage(base, 0, 0, T, T);
    const s = T / MUNDO;
    for (const e of reg.edificios) {
      if (!e.dono || e.dono === e.zona.dono) continue;
      ctx.fillStyle = "#" + e.dono.cor.toString(16).padStart(6, "0");
      ctx.globalAlpha = e.dono.governo ? .45 : .8;

function visivelNoMapa(s, P) {
  if (s.vida === "ok") return true;

  if (s.vida === "rendido") return P.tempo - s.caiuEm < 20;

function atualizaTropas(T, P, reg, agora) {
  let n = 0, na = 0;
  T.soldadoDe.length = 0;
  for (const s of P.soldados) {
    if (n >= MAX_SOLDADOS || !visivelNoMapa(s, P)) continue;
    const y = alturaEm(reg, s.x, s.z), rot = Math.atan2(Math.cos(s.rumo), Math.sin(s.rumo));
    T.M.makeRotationY(rot);
    if (s.vida === "ferido" || s.vida === "morto") { T.R.makeRotationX(-Math.PI / 2); T.M.multiply(T.R); }
    T.M.scale(T.S); T.M.setPosition(s.x, y + (s.vida === "ok" || s.vida === "rendido" ? 0 : .3), s.z);
    T.C.setHex(s.vida === "morto" ? 0x6a6a64 : s.vida === "rendido" ? 0xf2f2ee : s.faccao.cor);
    for (const m of T.malhas) { m.setMatrixAt(n, m === T.malhas[4] && !s.arma ? T.Z : T.M); if (m.userData.colorido) m.setColorAt(n, T.C); }

    if (s.vida === "ok") T.C.setHex(s.faccao.cor); T.discos.setColorAt(n, T.C);
    T.soldadoDe[n] = s; n++;
  }
  for (const sq of P.esquadroes) {
    if (na >= 400 || !ativos(sq).length) continue;
    const [cx, cz] = centroDoEsquadrao(sq);
    T.M.makeTranslation(cx, alturaEm(reg, cx, cz) + .3, cz);
    T.aneis.setMatrixAt(na, T.M); T.C.setHex(sq.combate ? 0xff5a3a : sq.faccao.cor); T.aneis.setColorAt(na, T.C); na++;
  }

  for (const m of T.malhas) { m.count = n; m.instanceMatrix.needsUpdate = true; if (m.instanceColor) m.instanceColor.needsUpdate = true; }
  T.aneis.count = na; T.aneis.instanceMatrix.needsUpdate = true; if (T.aneis.instanceColor) T.aneis.instanceColor.needsUpdate = true;

  for (const d of P.destrocos || []) poeVeiculo(d.x, d.z, d.rumo, d.nivel, 0x1e1e1c, false);

      for (let i = 0; i < 4; i++) T.listaFum.push({ x: ef.bx + (Math.random() - .5) * 3 * g, y: yb, z: ef.bz + (Math.random() - .5) * 3 * g, nasce: agora + .35 + i * .08, vida: 4 + Math.random() * 2, g: g * (.8 + Math.random() * .5) });

  let nf = 0;
  for (const x of T.listaFum) {
    const f = (agora - x.nasce) / x.vida; if (f < 0) continue;

  T.explosoes.count = ne; T.explosoes.instanceMatrix.needsUpdate = true;
}

    else if (tipo === "vitoria") aviso("Vitória! Todas as facções rivais foram eliminadas.", "star", "bom");
    else if (tipo === "novobatalhao" && meu(d.b.faccao)) { aviso(d.b.nome + " criado: " + d.b.lider.nome + " comanda da base", "groups", "bom", [d.b.base.x, d.b.base.z]); rotuloDoBatalhao(d.b); }
    else if (tipo === "ordemcumprida" && meu(d.b.faccao)) aviso(d.b.nome + " tomou " + d.b.ordem.alvo.nome + "; agora protege a área", "flag", "bom");
    else if (tipo === "ataqueconjunto" && meu(d.b.faccao)) aviso(d.b.nome + ": o líder juntou os esquadrões contra " + nm(d.e) + " em " + d.e.zona.nome, "swords", "seu", onde(d.e));
    else if (tipo === "semfrente" && meu(d.b.faccao)) aviso(d.b.nome + ": você não tem fronteira com " + d.b.ordem.alvo.nome + " ainda", "wall", "info");
    else if (tipo === "semguerra" && meu(d.b.faccao)) aviso(d.b.nome + ": a guerra acabou, passou a segurar a frente", "handshake", "info");
    else if (tipo === "sugestaorecusada" && meu(d.s.faccao)) aviso("Líder do " + d.b.nome + " não aceitou a troca de " + d.s.nome + ": " + d.motivo, "record_voice_over", "info");
    else if (tipo === "sugestaoaceita" && meu(d.s.faccao)) aviso("Líder do " + d.b.nome + " aceitou a sugestão para " + d.s.nome, "record_voice_over", "bom");
    else if (tipo === "mudoubatalhao" && meu(d.s.faccao)) aviso(d.s.nome + " está numa base esperando o " + (d.b ? d.b.nome : "novo destino"), "swap_horiz", "info");
    else if (tipo === "pedidocomando" && meu(d.s.faccao)) aviso(d.s.nome + " vai a uma base assumir um batalhão novo", "star", "seu");
    else if (tipo === "juntou" && meu(d.sq.faccao)) aviso(d.de.nome + " (" + d.n + ") se juntou a " + d.sq.nome + " no QG", "groups", "bom");
    else if (tipo === "reforcado" && meu(d.sq.faccao)) aviso(d.s.nome + " saiu da reserva e entrou em " + d.sq.nome, "person_add", "bom");
    else if (tipo === "reacao" && meu(d.sq.faccao)) aviso(d.sq.nome + " (reação rápida) foi para cima de " + d.o.faccao.nome, "bolt", "seu", [d.e.x, d.e.z]);
    else if (tipo === "lidermandou" && meu(d.b.faccao)) aviso("Líder do " + d.b.nome + " mandou " + d.sq.nome + " reforçar " + textoUmaOrdem(d.o).toLowerCase(), "record_voice_over", "seu");
    else if (tipo === "socorro" && meu(d.sq.faccao)) aviso(d.sq.nome + " foi socorrer: " + d.o.faccao.nome + " atacando perto", "lifebuoy", "seu", [d.e.x, d.e.z]);
    else if (tipo === "caca" && meu(d.sq.faccao)) aviso(d.sq.nome + " está caçando " + d.o.nome + " (" + d.o.faccao.nome + ")", MISSOES.cacar.icone, "seu", [d.e.x, d.e.z]);
    else if (tipo === "semalvo" && meu(d.sq.faccao)) aviso(d.sq.nome + " não acha inimigo que dê para vencer por perto", MISSOES.cacar.icone, "info");
    else if (tipo === "ajuda" && meu(d.sq.faccao)) { const [x, z] = centroDoEsquadrao(d.sq); aviso(d.sq.nome + " pede reforço!", "lifebuoy", "perigo", [x, z]); }
    else if (tipo === "vaiajudar" && meu(d.sq.faccao)) aviso(d.sq.nome + " vai ajudar " + d.ajudado.nome, "lifebuoy", "seu");
    else if (tipo === "apoiofim" && meu(d.sq.faccao)) aviso(d.sq.nome + ": o esquadrão que ele apoiava caiu; está sem missão", MISSOES.apoiar.icone, "perigo");
    else if (tipo === "fortificado" && meu(d.sq.faccao)) aviso("Engenheiros terminaram de fortificar " + nm(d.e) + " em " + d.e.zona.nome, "wall", "bom", onde(d.e));
    else if (tipo === "tratadocampo" && meu(d.s.faccao)) aviso(d.m.nome + " tratou " + d.s.nome + " no campo: voltou a lutar", "medical_services", "bom");
    else if (tipo === "kitacabou" && meu(d.s.faccao)) aviso("O kit médico de " + d.s.nome + " acabou: precisa de outro no QG", "medical_services", "perigo");
    else if (tipo === "recusou" && meu(d.fac)) aviso(d.s.nome + " não aceitou mudar de lado", "lock", "info");
    else if (tipo === "armou" && meu(d.s.faccao)) aviso(d.s.nome + " pegou " + nomeMin(chave(d.s.arma, d.s.nivel || 1)) + " no arsenal", "inventory_2", "bom");
    else if (tipo === "recarregar" && meu(d.sq.faccao)) aviso(d.sq.nome + " está sem munição: foi recarregar na " + nomeBase(partida, d.base), "bullet", "info", [d.base.x, d.base.z]);
    else if (tipo === "semestoque" && meu(d.sq.faccao)) aviso(d.sq.nome + " está sem munição e o estoque de " + MUNICOES[d.tipo].curto.toLowerCase() + " acabou: compre em Armas", "bullet", "perigo");
    else if (tipo === "comprou" && meu(d.fac) && d.auto) {}
    else if (tipo === "comprou" && meu(d.fac)) aviso("Comprou " + d.n + " " + nomeMin(d.item) + " no mercado negro", "storefront", "seu");
    else if (tipo === "encomendou" && meu(d.fac)) aviso("Carga de contrabando a caminho: " + d.n + " " + nomeMin(d.item), "local_shipping", "seu");
    else if (tipo === "chegoucarga" && meu(d.fac)) aviso("A carga de contrabando chegou: " + d.c.n + " " + nomeMin(d.c.item), "local_shipping", "bom");
    else if (tipo === "apreendida" && meu(d.fac)) aviso("A carga de contrabando foi apreendida no caminho", "local_shipping", "perigo");
    else if (tipo === "fabricou" && meu(d.fac)) aviso("Ficou pronto: " + nomeMin(d.item), "precision_manufacturing", "bom");
    else if (tipo === "doacao" && meu(d.fac)) aviso(d.pais.n + " mandou " + [textoItens(d.itens), d.comida ? d.comida + " de comida" : ""].filter(Boolean).join(", "), d.pais.icone, "bom");
    else if (tipo === "pedido" && meu(d.fac)) aviso(d.pais.n + " pede: tome " + nm(d.pedido.alvo) + " em " + d.pedido.alvo.zona.nome, "assignment", "seu", onde(d.pedido.alvo));
    else if (tipo === "pedidocumprido" && meu(d.fac)) aviso(d.pais.n + " gostou: pedido cumprido (+" + PEDIDO.premio + " de relação)", d.pais.icone, "bom");
    else if (tipo === "pedidoperdido" && meu(d.fac)) aviso("O prazo do pedido de " + d.pais.n + " acabou (−" + PEDIDO.castigo + ")", d.pais.icone, "perigo");
    else if (tipo === "hora") mostraRecursos();
    if (MUDA_JANELA.has(tipo)) janelaSuja = true;
    if (tipo === "missao") atualizaSelecao();
    if (tipo === "ordem" && d.sq && meu(d.sq.faccao)) marcaTutorial.ordem = true;
    if (tipo !== "ordem") atualizaEmBreve();
  });
}
let agendado = false, janelaSuja = false;
const MUDA_JANELA = new Set(["hora", "recrutou", "armou", "comprou", "encomendou", "fabricou", "chegoucarga", "apreendida", "doacao", "baixa", "tratado", "rendicao", "pedido", "pedidocumprido", "pedidoperdido", "recusou", "eliminado", "chegou", "combate", "fimcombate", "evento", "reforcado", "tratadocampo", "kitacabou", "vaibase", "diplomacia", "proposta", "propostavenceu", "presente", "novobatalhao", "ordembatalhao", "mudoubatalhao", "recarregar", "comprou", "trocou", "semtroca", "esperando", "transferido", "novoesquadrao", "pedidotroca", "pedidotransfer", "entregou", "motorista", "veiculodestruido", "veiculocapturado", "veiculoatribuido", "viagem"]);
function atualizaEmBreve() {
  if (agendado) return; agendado = true;
  setTimeout(() => { agendado = false; mostraRecursos(); mostraCombates(); atualizaSelecao(); if (contexto) desenhaContexto(); if (janela && janela !== "ajuda" && janelaSuja && !document.querySelector(".tile.arrastando")) { janelaSuja = false; desenhaJanela(); } }, 500);
}

/* ---------- fluxo da partida ---------- */
function fundar(e, nome) {
  estado = "rivais"; dica(null);
  const f = criaFaccao(partida.faccoes.length, nome, COR_JOGADOR, { jogador: true });
  const sq = fundaFaccao(partida, f, e); marcaBase(f); rotuloDoEsquadrao(sq);
  for (const b of batalhoesDe(partida, f)) rotuloDoBatalhao(b);
  fechaContexto(); selBat = tutorial ? null : sq.bat; selecao = [];
  vaiPara(e.x, e.z, 600);
  const r = partida.r, usados = new Set([nome]), tomadas = [e];
  let i = 0;
  const proxima = () => {
    if (i >= regiao.nRivais) {
      estado = "jogo"; mudaVelocidade(tutorial ? 0 : 1); mostraRecursos(); atualizaSelecao();
      aviso(regiao.nRivais + " facções rivais entraram na região", "flag", "info");
      if (!tutorial) { dica("Clique com o botão direito no mapa para mandar seu esquadrão"); setTimeout(() => dica(null), 9000); }
      return;
    }
    const base = escolhaRival(regiao, r, tomadas); tomadas.push(base);
    const fr = criaFaccao(partida.faccoes.length, nomeUnico(r, NOMES_FAC_A, NOMES_FAC_B, usados), CORES_RIVAIS[i % CORES_RIVAIS.length]);
    const sqr = fundaFaccao(partida, fr, base); marcaBase(fr); rotuloDoEsquadrao(sqr);
    i++; setTimeout(proxima, 700);
  };
  setTimeout(proxima, 500);
}
function trocaRegiao(reg) {
  if (grupoMapa) { cena.remove(grupoMapa); descarta(grupoMapa); }
  limpa($("rotulos")); rotulos = []; selecao = []; selBat = null; escolhaFaccao = null; contexto = null; janela = null; zonaDestacada = null;
  for (const id of ["contexto", "modal", "ordens", "esquadroes"]) $(id).classList.add("oculto");
  limpa($("avisos-lista")); soldadoNaJanela = null;
  regiao = reg;
  grupoMapa = montaMapa(reg); cena.add(grupoMapa);
  partida = criaPartida(reg); partida.pausado = true; ouveA(partida);
  camada = criaCamadaTerritorio(reg, geoTerreno); grupoMapa.add(camada.malha); camada.atualiza();
  tropas = criaTropas(); grupoMapa.add(tropas.grupo); atualizaTropas(tropas, partida, reg, performance.now() / 1000);
  linhaRota = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: COR_JOGADOR, depthTest: false, transparent: true, opacity: .9 }));
  linhaRota.visible = false; linhaRota.renderOrder = 5; grupoMapa.add(linhaRota);
  linhaPrevia = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xff7a45, depthTest: false, transparent: true, opacity: .95 }));
  linhaPrevia.visible = false; linhaPrevia.renderOrder = 6; grupoMapa.add(linhaPrevia);
  marca(anelFoco, caixaFoco, null); marca(anelEscolha, caixaEscolha, null);
}
function novaPartida(semente, nRivais) {
  estado = "gerando";
  $("menu").classList.add("oculto"); $("carregando").classList.remove("oculto");
  setTimeout(() => {
    const reg = geraRegiao(semente); reg.nRivais = nRivais;
    reg.nomeSugerido = nomeUnico(reg.sorteio, NOMES_FAC_A, NOMES_FAC_B, new Set());
    trocaRegiao(reg); poeRotulos(reg);
    cam.ax = cam.x = 0; cam.az = cam.z = 0; cam.ad = 1700; cam.giro = .5; cam.incl = .9;
    $("carregando").classList.add("oculto"); for (const id of ["topo", "cam", "avisos"]) $(id).classList.remove("oculto");
    $("nome-regiao").textContent = reg.nome;
    mostraRecursos(); mudaVelocidade(0);
    estado = "escolher";
    if (comTutorial) iniciaTutorial(); else if (tutorial) terminaTutorial(false);
    if (modoInicio === "sortear") { fundar(escolhaRival(reg, partida.r, []), reg.nomeSugerido); return; }
    dica("Clique num prédio fora da área cinza (o governo antigo) para fundar sua facção.");
  }, 40);
}
function abreMenu() {
  estado = "menu"; if (partida) partida.pausado = true;
  for (const id of ["topo", "contexto", "modal", "ordens", "esquadroes", "cam", "dica", "avisos"]) $(id).classList.add("oculto");
  contexto = null; janela = null; selecao = [];
  if (tutorial) terminaTutorial(false);
  $("menu").classList.remove("oculto");
}
function sementeNova() { return Math.random().toString(36).slice(2, 8).toUpperCase(); }

function inicia() {
  const canvas = $("cena");
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
  catch (e) { const er = $("erro"); er.classList.remove("oculto"); er.textContent = "Este navegador não conseguiu abrir o modo 3D (WebGL)."; $("menu").classList.add("oculto"); return; }
  vTmp = new THREE.Vector3(); ponteiro = new THREE.Vector2();
  preparaFormas();
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  cena = new THREE.Scene(); cena.background = new THREE.Color(0xcfd3cf); cena.fog = new THREE.Fog(0xcfd3cf, 2200, 7000);
  camera = new THREE.PerspectiveCamera(42, 1, 1, 12000);
  cena.add(new THREE.HemisphereLight(0xeef0ec, 0x8a7a5a, .78));
  sol = new THREE.DirectionalLight(0xfff0d4, .95);
  sol.castShadow = true; sol.shadow.mapSize.set(4096, 4096);
  sol.shadow.bias = -.0006; sol.shadow.normalBias = .6;
  cena.add(sol); cena.add(sol.target);
  raio = new THREE.Raycaster();
  anelFoco = criaAnel(0xffffff); anelEscolha = criaAnel(COR_JOGADOR);
  caixaFoco = criaCaixaSel(0xffffff); caixaEscolha = criaCaixaSel(COR_JOGADOR);
  for (const o of [anelFoco, anelEscolha, caixaFoco, caixaEscolha]) cena.add(o);
  ligaEntrada(canvas);
  document.querySelectorAll("#tempo button").forEach(b => b.addEventListener("click", () => mudaVelocidade(+b.dataset.v)));
  document.querySelectorAll("[data-janela]").forEach(b => b.addEventListener("click", () => abreJanela(janela === b.dataset.janela ? null : b.dataset.janela)));
  $("bt-menu").addEventListener("click", abreMenu);
  $("av-recolhe").addEventListener("click", () => $("avisos").classList.toggle("aberto"));

  const ajusta = () => { renderer.setSize(window.innerWidth, window.innerHeight, false); camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); };
  window.addEventListener("resize", ajusta); ajusta();

  let nRivais = 3;
  const cx = $("rivais");
  for (let n = 1; n <= 5; n++) {
    const b = cria("button", n === nRivais ? "ativo" : null, String(n)); b.type = "button";
    b.addEventListener("click", () => { nRivais = n; cx.querySelectorAll("button").forEach(o => o.classList.toggle("ativo", o === b)); });
    cx.appendChild(b);
  }
  document.querySelectorAll("#inicio button").forEach(b => b.addEventListener("click", () => {
    modoInicio = b.dataset.modo; document.querySelectorAll("#inicio button").forEach(o => o.classList.toggle("ativo", o === b));
  }));
  comTutorial = !tutorialJaVisto();
  const marcaTu = () => document.querySelectorAll("#op-tutorial button").forEach(o => o.classList.toggle("ativo", (o.dataset.tu === "1") === comTutorial));
  document.querySelectorAll("#op-tutorial button").forEach(b => b.addEventListener("click", () => { comTutorial = b.dataset.tu === "1"; marcaTu(); }));
  marcaTu();
  $("semente").value = sementeNova();
  $("sortear").addEventListener("click", () => { $("semente").value = sementeNova(); });
  $("gerar").addEventListener("click", () => novaPartida(($("semente").value.trim() || sementeNova()).toUpperCase(), nRivais));

  let antes = performance.now(), proximoPainel = 0;
  const quadro = agora => {
    requestAnimationFrame(quadro);
    agora = agora || performance.now();
    const dt = Math.max(0, (agora - antes) / 1000); antes = agora;
    if (estado === "menu") cam.giro += .0012;
    if (estado === "jogo" && partida) {
      passoDaPartida(partida, dt);
      $("relogio").textContent = relogio(partida);
      if (agora > proximoPainel) { proximoPainel = agora + 1000; mostraEsquadroes(); mostraRotaSelecionada(); mostraCombates(); }
    }
    if (tropas && partida) atualizaTropas(tropas, partida, regiao, agora / 1000);
    if (camada && camada.sujo && agora - ultimaCamada > 250) { ultimaCamada = agora; camada.atualiza(); }
    teclado(); atualizaCamera(); atualizaRotulos(); atualizaTutorial();
    renderer.render(cena, camera);
  };
  $("carregando").classList.remove("oculto");
  setTimeout(() => {
    trocaRegiao(geraRegiao("FUNDO"));
    $("carregando").classList.add("oculto");
    requestAnimationFrame(quadro);
  }, 40);
}

if (typeof THREE === "undefined") {
  const er = $("erro"); er.classList.remove("oculto"); $("menu").classList.add("oculto");
  er.textContent = "Não foi possível carregar a biblioteca 3D. Verifique a conexão e recarregue a página.";
} else inicia();

</script>
